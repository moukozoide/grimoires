:1fr auto;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}\n.line:last-child{border-bottom:0}\n.line .nm{font-family:var(--serif)}\n.line .nm small{display:block;font-family:var(--sans);color:var(--ink-3);font-size:.8rem}\n.line .v{font-family:var(--serif);font-weight:700;text-align:right;white-space:nowrap}\n.upm{color:var(--balance);font-size:.7em;margin-left:4px;vertical-align:1px}\n.inv .facts.der{display:flex;flex-wrap:wrap}\n.inv .facts.der div{flex:1 1 30%}\n@media (prefers-color-scheme: light){:root:not([data-theme=\"dark\"]) .el-card img,:root:not([data-theme=\"dark\"]) .el-head img{filter:brightness(.42) contrast(1.6) sepia(.35)}}\n:root[data-theme=\"light\"] .el-card img,:root[data-theme=\"light\"] .el-head img{filter:brightness(.42) contrast(1.6) sepia(.35)}\n.pct{font-family:var(--sans);font-weight:500;font-size:.8rem;border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-left:6px;color:var(--ink-2)}\n.inv-actions{display:grid;gap:8px;margin-top:22px}\n.inv-actions .btn{padding:10px}\n<\/style>\n<\/head>\n<body>\n<div class=\"desk\" id=\"desk\">\n  <div class=\"phone\" id=\"phone\">\n    <div class=\"app\" id=\"app\"><\/div>\n  <\/div>\n<\/div>\n\n<script>\nconst MODE = \"site\";                 // \"mj\" (page du MJ) ou \"site\" (site des joueurs)\nconst EMBEDDED_XLSX = \"\";\nconst SITE_FILES = {};\nconst BUILD = \"2026-10-19T11:08:47Z\";                 // date de construction, fixée par build_mj.py\n/* Copie de la page MJ telle qu'elle a été chargée (avant tout affichage), pour la mettre en ligne avec le site. */\nconst SELF_HTML = MODE === \"mj\" ? \"<!doctype html>\\n\" + document.documentElement.outerHTML + \"\\n\" : \"\";\nconst buildLabel = b => /^\\d{4}-/.test(b) ? new Date(b).toLocaleString(\"fr-FR\", { day:\"2-digit\", month:\"2-digit\", year:\"numeric\", hour:\"2-digit\", minute:\"2-digit\" }) : b;\nconst LS_CUR = \"grimoires.current\", LS_PREV = \"grimoires.previous\", LS_GH = \"grimoires.github\", LS_ROUTE = \"grimoires.lastRoute\";\n\n/* ---------- utils ---------- */\nconst $ = s => document.querySelector(s);\nconst esc = s => String(s ?? \"\").replace(/[&<>\"']/g, c => ({\"&\":\"&amp;\",\"<\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\",\"'\":\"&#39;\"}[c]));\nconst norm = s => String(s ?? \"\").replace(/Œ/g,\"Oe\").replace(/œ/g,\"oe\").normalize(\"NFD\").replace(/[̀-ͯ]/g,\"\").toLowerCase().replace(/\\s+/g,\" \").trim();\nconst slug = s => norm(s).replace(/[^a-z0-9]+/g,\"-\").replace(/^-|-$/g,\"\");\nconst yes = v => /^(oui|o|yes|1|vrai|x)$/i.test(String(v ?? \"\").trim());\nconst str = v => v == null ? \"\" : String(v).trim();\nconst b64enc = s => { const b = new TextEncoder().encode(s); let x = \"\"; for (let i = 0; i < b.length; i += 0x8000) x += String.fromCharCode(...b.subarray(i, i + 0x8000)); return btoa(x); };\nconst b64dec = s => new TextDecoder().decode(Uint8Array.from(atob(String(s).replace(/\\s/g,\"\")), c => c.charCodeAt(0)));\nconst isDesk = () => MODE === \"mj\" && !$(\"#desk\").classList.contains(\"player-only\") && matchMedia(\"(min-width: 861px)\").matches;\nconst store = {\n  get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },\n  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }\n};\n\n/* ---------- parsing ---------- */\nfunction readSheet(wb, name){\n  const key = Object.keys(wb.Sheets).find(n => norm(n) === norm(name));\n  if (!key) return null;\n  const rows = XLSX.utils.sheet_to_json(wb.Sheets[key], {defval:null, raw:true});\n  // normalise headers: lowercase, accents removed, text before \"(\" kept\n  return rows.map(r => {\n    const o = {};\n    for (const [h,v] of Object.entries(r)) o[norm(h).replace(/\\s*\\(.*$/,\"\")] = typeof v === \"string\" ? v.trim() : v;\n    return o;\n  }).filter(o => Object.values(o).some(v => v !== null && v !== \"\"));\n}\nfunction parseType(t){\n  const m = /^\\s*([^()]+?)\\s*(?:\\((.+)\\))?\\s*$/.exec(t || \"\");\n  return { alignment: m ? m[1] : \"\", form: m && m[2] ? m[2] : \"\" };\n}\nfunction parseWorkbook(wb){\n  const missing = [\"Campagnes\",\"PJ\",\"Ouvrages\",\"Contenu\",\"Sorts\",\"Grimoires\"].filter(n => !readSheet(wb,n));\n  if (missing.length) throw new Error(\"Onglet(s) manquant(s) : \" + missing.join(\", \"));\n  const campaigns = readSheet(wb,\"Campagnes\").filter(r => r.campagne).map(r => ({\n    name: str(r.campagne), id: str(r.identifiant) || slug(r.campagne), active: r.active == null ? true : yes(r.active)\n  }));\n  const pcs = readSheet(wb,\"PJ\").filter(r => r.pj).map(r => ({\n    campaign: str(r.campagne), name: str(r.pj), full: str(r[\"nom complet\"]) || str(r.pj),\n    id: str(r.identifiant) || slug(r.pj), int: Number(r.int) || 0, active: r.actif == null ? true : yes(r.actif)\n  }));\n  const books = readSheet(wb,\"Ouvrages\").filter(r => r.ouvrage).map(r => ({\n    campaign: str(r.campagne), name: str(r.ouvrage), lang: str(r.langue),\n    mod: r.modificateur == null || r.modificateur === \"\" ? null : Number(r.modificateur),\n    revealed: yes(r.revele), notes: str(r.notes)\n  }));\n  const contents = readSheet(wb,\"Contenu\").filter(r => r.ouvrage && r.sort).map(r => ({ book: str(r.ouvrage), spell: str(r.sort), notes: str(r.notes) }));\n  const spells = readSheet(wb,\"Sorts\").filter(r => r.sort).map(r => {\n    const t = parseType(str(r[\"type de magie\"]));\n    return { name: str(r.sort), cost: str(r.cout), type: str(r[\"type de magie\"]), alignment: t.alignment, form: t.form,\n             ref: str(r[\"ref.\"] ?? r.ref), range: str(r.portee), effects: str(r.effets), origin: str(r[\"origine\"]) };\n  });\n  const grimoires = readSheet(wb,\"Grimoires\").filter(r => r.pj && r.sort).map(r => ({\n    pc: str(r.pj), spell: str(r.sort), memory: norm(r.statut).includes(\"memoire\"), learning: norm(r.statut).includes(\"apprentissage\"),\n    progress: str(r.progression), incantation: str(r.incantation)\n  }));\n  return { campaigns, pcs, books, contents, spells, grimoires, importedAt: new Date().toISOString() };\n}\n\n/* ---------- model & checks ---------- */\nfunction buildModel(data){\n  const spellBy = new Map(data.spells.map(s => [norm(s.name), s]));\n  const issues = [];\n  const dup = (arr, f, label) => { const seen = new Set(); arr.forEach(x => { const k = norm(f(x)); if (seen.has(k)) issues.push(`${label} en double : « ${f(x)} »`); seen.add(k); }); };\n  dup(data.spells, s => s.name, \"Sort\");\n  dup(data.pcs, p => p.name, \"PJ\");\n  dup(data.campaigns, c => c.name, \"Campagne\");\n  dup(data.books, b => b.campaign + \" / \" + b.name, \"Ouvrage\");\n  const campNames = new Set(data.campaigns.map(c => norm(c.name)));\n  data.pcs.forEach(p => { if (!campNames.has(norm(p.campaign))) issues.push(`PJ ${p.name} : campagne « ${p.campaign} » inconnue`); });\n  data.books.forEach(b => { if (!campNames.has(norm(b.campaign))) issues.push(`Ouvrage ${b.name} : campagne « ${b.campaign} » inconnue`); });\n  const pcBy = new Map(data.pcs.map(p => [norm(p.name), p]));\n  data.grimoires.forEach(g => {\n    if (!pcBy.has(norm(g.pc))) issues.push(`Grimoires : PJ « ${g.pc} » inconnu`);\n    if (!spellBy.has(norm(g.spell))) issues.push(`Grimoires : sort « ${g.spell} » (${g.pc}) absent du catalogue`);\n  });\n  const bookNames = new Set(data.books.map(b => norm(b.name)));\n  data.contents.forEach(c => {\n    if (!bookNames.has(norm(c.book))) issues.push(`Contenu : ouvrage « ${c.book} » absent de l'onglet Ouvrages`);\n    if (!spellBy.has(norm(c.spell))) issues.push(`Contenu : sort « ${c.spell} » (${c.book}) absent du catalogue`);\n  });\n  data.books.forEach(b => { if (!data.contents.some(c => norm(c.book) === norm(b.name))) issues.push({info:true, text:`Ouvrage ${b.name} (${b.campaign}) : aucun sort dans Contenu`}); });\n  data.spells.forEach(s => { if (!s.type) issues.push({info:true, text:`Sort ${s.name} : type de magie vide`}); });\n  data.pcs.forEach(p => {\n    const mem = data.grimoires.filter(g => norm(g.pc) === norm(p.name) && g.memory).length;\n    if (p.int && mem > p.int) issues.push(`${p.name} : ${mem} sorts en mémoire pour une INT de ${p.int}`);\n  });\n  data.grimoires.forEach(g => { if (g.progress && !g.learning) issues.push({info:true, text:`${g.pc} : progression renseignée sur ${g.spell}, qui n'est pas en apprentissage`}); });\n  const ids = new Map(); data.pcs.forEach(p => { const k = norm(p.campaign)+\"/\"+p.id; if (ids.has(k)) issues.push(`Identifiant de lien « ${p.id} » utilisé deux fois dans ${p.campaign}`); ids.set(k,1); });\n  return { ...data, spellBy, pcBy, issues };\n}\n\n/* What a given campaign can see */\nfunction campaignView(M, campName){\n  const pcs = M.pcs.filter(p => norm(p.campaign) === norm(campName) && p.active);\n  const pcSet = new Set(pcs.map(p => norm(p.name)));\n  const books = M.books.filter(b => norm(b.campaign) === norm(campName) && b.revealed);\n  const bookSet = new Set(books.map(b => norm(b.name)));\n  const visible = new Set();\n  M.grimoires.forEach(g => { if (pcSet.has(norm(g.pc))) visible.add(norm(g.spell)); });\n  M.contents.forEach(c => { if (bookSet.has(norm(c.book))) visible.add(norm(c.spell)); });\n  return { pcs, books, visible };\n}\n\n/* ---------- variantes de sorts propres à une campagne ---------- */\n/* Le catalogue de sorts est commun aux campagnes. Une campagne dont la règle d'invocation fixe\n   sa propre dépense (regles/elementaires.json → campaignRules.<id>.pm) affiche ce minimum pour\n   « Convoquer un Elémentaire ». Appliqué à la publication et à l'affichage. */\nfunction rulesSync(){\n  if (!ELEM && SITE_FILES[ELEM_RULES_PATH]) { try { ELEM = JSON.parse(SITE_FILES[ELEM_RULES_PATH]); } catch {} }\n  return ELEM;\n}\nfunction campSpell(s, campId){\n  const R = rulesSync(), r = R && R.campaignRules && R.campaignRules[campId];\n  if (s && r && r.pm && isElemSpell(s.name)) return { ...s, cost: r.pm.min + \" minimum\" };\n  return s;\n}\nfunction curCampId(){ const r = route(); if (r.c) return r.c; const c = current().camp; return c ? c.id : \"\"; }\n\n/* ---------- what gets published: one file per active campaign ---------- */\nfunction publishedViews(M){\n  return M.campaigns.filter(c => c.active).map(c => {\n    const v = campaignView(M, c.name);\n    const pcN = new Set(v.pcs.map(p => norm(p.name)));\n    const bN = new Set(v.books.map(b => norm(b.name)));\n    return { id: c.id, name: c.name, data: {\n      campaigns: [{ name: c.name, id: c.id, active: true }],\n      pcs: v.pcs.map(({campaign,name,full,id,int}) => ({campaign,name,full,id,int,active:true})),\n      books: v.books.map(({campaign,name,lang,mod}) => ({campaign,name,lang,mod,revealed:true})),\n      contents: M.contents.filter(x => bN.has(norm(x.book))).map(({book,spell}) => ({book,spell})),\n      spells: M.spells.filter(s => v.visible.has(norm(s.name))).map(s => campSpell(s, c.id)),\n      grimoires: M.grimoires.filter(g => pcN.has(norm(g.pc)))\n    }};\n  });\n}\nfunction mergeViews(views){\n  const m = { campaigns:[], pcs:[], books:[], contents:[], spells:[], grimoires:[] }, sS = new Set(), sC = new Set();\n  views.forEach(({data:d}) => {\n    m.campaigns.push(...d.campaigns); m.pcs.push(...d.pcs); m.books.push(...d.books); m.grimoires.push(...d.grimoires);\n    d.spells.forEach(s => { const k = norm(s.name); if (!sS.has(k)) { sS.add(k); m.spells.push(s); } });\n    d.contents.forEach(c => { const k = norm(c.book)+\"|\"+norm(c.spell); if (!sC.has(k)) { sC.add(k); m.contents.push(c); } });\n  });\n  return m;\n}\n\n/* ---------- diff (on what players see) ---------- */\nconst ws = v => String(v ?? \"\").replace(/\\s+/g,\" \").trim();\nfunction diff(prev, cur){\n  if (!prev) return null;\n  if (!prev.campaigns.length) return `<p>Première publication : ${cur.campaigns.length} campagne(s), ${cur.pcs.length} PJ, ${cur.spells.length} sorts visibles.<\/p>`;\n  const out = [];\n  const camps = new Set([...prev.campaigns, ...cur.campaigns].map(c => c.name));\n  const keyG = g => norm(g.pc)+\"|\"+norm(g.spell);\n  const pg = new Map(prev.grimoires.map(g => [keyG(g), g])), cg = new Map(cur.grimoires.map(g => [keyG(g), g]));\n  const campOfPc = (d, pc) => (d.pcs.find(p => norm(p.name) === norm(pc)) || {}).campaign || \"?\";\n  for (const camp of camps){\n    const items = [];\n    const inCamp = (d, pc) => norm(campOfPc(d, pc)) === norm(camp);\n    const inP = prev.campaigns.some(c => norm(c.name) === norm(camp)), inC = cur.campaigns.some(c => norm(c.name) === norm(camp));\n    if (!inC){ out.push(`<h3>${esc(camp)}<\/h3><ul><li class=\"del\">Campagne retirée du site<\/li><\/ul>`); continue; }\n    if (!inP){ out.push(`<h3>${esc(camp)}<\/h3><ul><li class=\"add\">Nouvelle campagne publiée (${cur.pcs.filter(p => norm(p.campaign)===norm(camp)).length} PJ)<\/li><\/ul>`); continue; }\n    for (const [k,g] of cg) if (inCamp(cur,g.pc)) {\n      const o = pg.get(k);\n      if (!o) items.push(`<li class=\"add\">${esc(g.pc)} ${g.learning ? \"commence à apprendre\" : \"apprend\"} ${esc(g.spell)}${g.memory ? \" (en mémoire)\" : \"\"}<\/li>`);\n      else {\n        if (!!o.learning !== !!g.learning) items.push(`<li class=\"add\">${esc(g.pc)} ${g.learning ? \"repasse en apprentissage de\" : \"a fini d'apprendre\"} ${esc(g.spell)}<\/li>`);\n        else if (g.learning && (o.progress||\"\") !== (g.progress||\"\")) items.push(`<li>${esc(g.pc)} : progression sur ${esc(g.spell)}${g.progress ? \" (\" + esc(g.progress) + \")\" : \"\"}<\/li>`);\n        if (o.memory !== g.memory) items.push(`<li>${esc(g.pc)} : ${esc(g.spell)} ${g.memory ? \"passe en mémoire\" : \"sort de la mémoire\"}<\/li>`);\n        if (ws(o.incantation) !== ws(g.incantation)) items.push(`<li>${esc(g.pc)} : incantation de ${esc(g.spell)} modifiée<\/li>`);\n      }\n    }\n    for (const [k,g] of pg) if (!cg.has(k) && inCamp(prev,g.pc)) items.push(`<li class=\"del\">${esc(g.pc)} perd ${esc(g.spell)}<\/li>`);\n    const pb = new Map(prev.books.filter(b => norm(b.campaign)===norm(camp)).map(b => [norm(b.name), b]));\n    cur.books.filter(b => norm(b.campaign)===norm(camp)).forEach(b => {\n      const o = pb.get(norm(b.name));\n      if (!o) items.push(`<li class=\"add\">Ouvrage révélé : ${esc(b.name)}<\/li>`);\n      else if (o.lang !== b.lang || o.mod !== b.mod) items.push(`<li>${esc(b.name)} : langue ou modificateur modifié<\/li>`);\n    });\n    pb.forEach((b,k) => { if (!cur.books.some(x => norm(x.campaign)===norm(camp) && norm(x.name)===k)) items.push(`<li class=\"del\">Ouvrage caché ou retiré : ${esc(b.name)}<\/li>`); });\n    const pp = new Set(prev.pcs.filter(p=>norm(p.campaign)===norm(camp)).map(p=>norm(p.name)));\n    cur.pcs.filter(p=>norm(p.campaign)===norm(camp)).forEach(p => { if (!pp.has(norm(p.name))) items.push(`<li class=\"add\">Nouveau PJ : ${esc(p.name)}<\/li>`); });\n    prev.pcs.filter(p=>norm(p.campaign)===norm(camp)).forEach(p => { if (!cur.pcs.some(x => norm(x.name)===norm(p.name))) items.push(`<li class=\"del\">PJ retiré : ${esc(p.name)}<\/li>`); });\n    const pPc = new Map(prev.pcs.map(p => [norm(p.name), p]));\n    cur.pcs.filter(p=>norm(p.campaign)===norm(camp)).forEach(p => { const o = pPc.get(norm(p.name)); if (o && (o.int !== p.int || o.full !== p.full || o.id !== p.id)) items.push(`<li>${esc(p.name)} : fiche modifiée (nom, INT ou lien)<\/li>`); });\n    if (items.length) out.push(`<h3>${esc(camp)}<\/h3><ul>${items.join(\"\")}<\/ul>`);\n  }\n  const ps = new Map(prev.spells.map(s => [norm(s.name), s]));\n  const cat = [];\n  cur.spells.forEach(s => {\n    const o = ps.get(norm(s.name));\n    if (!o) { cat.push(`<li class=\"add\">Nouveau sort visible : ${esc(s.name)}<\/li>`); return; }\n    const f = [\"cost\",\"type\",\"ref\",\"range\",\"effects\",\"origin\"].filter(k => ws(o[k]) !== ws(s[k]));\n    const lbl = {cost:\"coût\",type:\"type\",ref:\"réf.\",range:\"portée\",effects:\"effets\",origin:\"origine\"};\n    if (f.length) cat.push(`<li>${esc(s.name)} : ${f.map(k=>lbl[k]).join(\", \")}<\/li>`);\n  });\n  prev.spells.forEach(s => { if (!cur.spells.some(c => norm(c.name)===norm(s.name))) cat.push(`<li class=\"del\">Sort plus visible : ${esc(s.name)}<\/li>`); });\n  if (cat.length) out.push(`<h3>Sorts<\/h3><ul>${cat.join(\"\")}<\/ul>`);\n  return out.join(\"\") || `<p class=\"muted\">Aucun changement.<\/p>`;\n}\n\n/* ---------- state ---------- */\nlet M = null, DIFF = null;\nconst ui = { tab:\"grimoire\", q:\"\", mem:true, al:new Set(), form:new Set(), mjPc:\"\" };\n/* Grimoire du MJ : route #<campagne>/mj, uniquement sur la page MJ (jamais publié sur le site des joueurs). */\nconst MJ_ID = \"mj\";\nconst isMjView = () => MODE === \"mj\" && route().p === MJ_ID;\n/* Page MJ en plein écran, présentée comme celle des joueurs : mj.html?grimoire#<campagne>/mj */\nconst MJ_FULL = MODE === \"mj\" && /[?&](grimoire|joueur)\\b/.test(location.search);\nconst mjFullUrl = c => (GH.ready() ? GH.siteUrl() + \"mj.html\" : \"mj.html\") + \"?grimoire#\" + encodeURIComponent(c) + \"/\" + MJ_ID;\n\nfunction route(){\n  const [c, p, v] = location.hash.replace(/^#\\/?/,\"\").split(\"/\").map(decodeURIComponent);\n  return { c, p, v };\n}\nfunction current(){\n  if (!M) return {};\n  const r = route();\n  let camp = M.campaigns.find(x => x.id === r.c) || M.campaigns.find(x => x.active) || M.campaigns[0];\n  if (!camp) return {};\n  const view = campaignView(M, camp.name);\n  if (MODE === \"mj\" && r.p === MJ_ID) return { camp, view, pc: null, mj: true };\n  let pc = view.pcs.find(p => p.id === r.p) || view.pcs[0];\n  return { camp, view, pc };\n}\n\n/* ---------- MJ panel ---------- */\nfunction renderMJ(){\n  if (!M) return;\n  $(\"#links\").innerHTML = M.campaigns.map(c => {\n    const pcs = M.pcs.filter(p => norm(p.campaign) === norm(c.name));\n    const cur = current();\n    return `<div class=\"camp-name\">${esc(c.name)}${c.active ? \"\" : ' <span class=\"muted\">(inactive)<\/span>'}<\/div>\n      <ul class=\"links\"><li class=\"${cur.mj && cur.camp && cur.camp.id === c.id ? \"cur\" : \"\"}\"><a href=\"#${encodeURIComponent(c.id)}/${MJ_ID}\">Grimoire du MJ<\/a><span><a class=\"copy\" href=\"${esc(mjFullUrl(c.id))}\" target=\"_blank\" rel=\"noopener\">plein écran ↗<\/a>${GH.ready() ? `<button class=\"copy\" data-copy=\"${esc(mjFullUrl(c.id))}\">copier<\/button>` : \"\"}<\/span><\/li>${pcs.map(p => `<li class=\"${cur.pc && cur.pc.name===p.name ? \"cur\":\"\"}\"><a href=\"#${encodeURIComponent(c.id)}/${encodeURIComponent(p.id)}\">${esc(p.name)}${p.active?\"\":' <span class=\"muted\">(inactif)<\/span>'}<\/a><span>${GH.ready() ? `<code>${esc(GH.siteUrl())}#${esc(c.id)}/${esc(p.id)}<\/code><button class=\"copy\" data-copy=\"${esc(GH.siteUrl())}#${esc(c.id)}/${esc(p.id)}\">copier<\/button>` : `<code>…/#${esc(c.id)}/${esc(p.id)}<\/code>`}<\/span><\/li>`).join(\"\") || '<li class=\"muted\">Aucun PJ<\/li>'}<\/ul>`;\n  }).join(\"\");\n  $(\"#issues\").innerHTML = M.issues.length\n    ? M.issues.map(i => typeof i === \"string\" ? `<li>${esc(i)}<\/li>` : `<li class=\"info\">${esc(i.text)}<\/li>`).join(\"\")\n    : `<li class=\"ok\">Rien à signaler.<\/li>`;\n  $(\"#diffTitle\").textContent = DIFF_BASE === \"online\" ? \"Changements par rapport au site\" : \"Changements depuis l'import précédent\";\n  $(\"#diff\").innerHTML = DIFF || `<p class=\"muted\">${GH.ready() ? \"Comparaison avec le site en cours…\" : \"Importe une nouvelle version du fichier pour voir ce qui a changé.\"}<\/p>`;\n  document.querySelectorAll(\"#links a\").forEach(a => a.onclick = () => { if (!isDesk()) setTimeout(() => $(\"#previewTitle\").scrollIntoView({behavior:\"smooth\"}), 50); });\n  document.querySelectorAll(\"[data-copy]\").forEach(b => b.onclick = async () => { try { await navigator.clipboard.writeText(b.dataset.copy); b.textContent = \"copié\"; setTimeout(() => b.textContent = \"copier\", 1500); } catch {} });\n  renderPub();\n}\n\n/* ---------- GitHub ---------- */\nconst GH = {\n  cfg(){ return store.get(LS_GH) || { owner:\"\", repo:\"grimoires\", token:\"\" }; },\n  ready(){ const c = this.cfg(); return !!(c.owner && c.repo && c.token); },\n  siteUrl(){ const c = this.cfg(); return `https://${c.owner.toLowerCase()}.github.io/${c.repo}/`; },\n  async api(path, opts = {}){\n    const c = this.cfg();\n    const res = await fetch(`https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}${path}`, {\n      method: opts.method || \"GET\", cache: \"no-store\", body: opts.body,\n      headers: { \"Accept\":\"application/vnd.github+json\", \"Authorization\":`Bearer ${c.token}`, \"X-GitHub-Api-Version\":\"2022-11-28\" } });\n    if (res.status === 404 && opts.allow404) return null;\n    if (!res.ok){ let m = \"\"; try { m = (await res.json()).message; } catch {} const e = new Error(`GitHub ${res.status}${m ? \" : \" + m : \"\"}`); e.status = res.status; throw e; }\n    return res.status === 204 ? null : res.json();\n  },\n  async get(path){ const j = await this.api(`/contents/${path}`, {allow404:true}); return j && !Array.isArray(j) ? { sha: j.sha, text: b64dec(j.content || \"\") } : null; },\n  async list(dir){ const j = await this.api(`/contents/${dir}`, {allow404:true}); return Array.isArray(j) ? j : []; },\n  put(path, text, sha, message){ return this.api(`/contents/${path}`, { method:\"PUT\", body: JSON.stringify({ message, content: b64enc(text), ...(sha ? {sha} : {}) }) }); },\n  del(path, sha, message){ return this.api(`/contents/${path}`, { method:\"DELETE\", body: JSON.stringify({ message, sha }) }); }\n};\nlet ONLINE = null, DIFF_BASE = null, PUB_MSG = \"\", PUB_CLS = \"\", BUSY = false;\nconst ghError = e => e.status === 401 ? \"Clé de publication refusée (expirée ou mal copiée).\"\n  : e.status === 403 ? \"La clé n'a pas les droits nécessaires sur ce dépôt (Contents : Read and write).\"\n  : e.status === 404 ? \"Dépôt introuvable : vérifie le nom d'utilisateur, le nom du dépôt, et que la clé y a accès.\"\n  : /fetch/i.test(e.message) ? \"Impossible de joindre GitHub : vérifie la connexion internet.\" : e.message;\nfunction setMsg(m, cls = \"\"){ PUB_MSG = m; PUB_CLS = cls; renderPub(); }\n\nasync function fetchOnline(){\n  const files = (await GH.list(\"data\")).filter(f => f.name.endsWith(\".json\"));\n  const views = [];\n  for (const f of files){\n    const g = await GH.get(`data/${f.name}`);\n    try { views.push({ id: f.name.replace(/\\.json$/, \"\"), sha: g.sha, text: g.text, data: JSON.parse(g.text) }); } catch {}\n  }\n  return views;\n}\nasync function refreshOnline(){\n  if (!GH.ready() || !M) return;\n  try {\n    ONLINE = await fetchOnline();\n    DIFF_BASE = \"online\";\n    DIFF = diff(mergeViews(ONLINE), mergeViews(publishedViews(M)));\n    if (PUB_CLS === \"err\") setMsg(\"\");\n  } catch(e){ ONLINE = null; setMsg(ghError(e), \"err\"); }\n  renderMJ();\n}\nasync function publish(){\n  const blocking = M.issues.filter(i => typeof i === \"string\");\n  if (blocking.length && !confirm(`${blocking.length} point(s) à vérifier dans les contrôles. Publier quand même ?`)) return;\n  BUSY = true; setMsg(\"Publication en cours…\");\n  try {\n    const cur = publishedViews(M), online = await fetchOnline();\n    let n = 0;\n    for (const v of cur){\n      const text = JSON.stringify(v.data), o = online.find(x => x.id === v.id);\n      if (o && o.text === text) continue;\n      await GH.put(`data/${v.id}.json`, text, o && o.sha, `Grimoires : ${v.name}`); n++;\n    }\n    for (const o of online) if (!cur.some(v => v.id === o.id)){ await GH.del(`data/${o.id}.json`, o.sha, `Retrait de la campagne ${o.id}`); n++; }\n    BUSY = false;\n    setMsg(n ? `Publié à ${new Date().toLocaleTimeString(\"fr-FR\",{hour:\"2-digit\",minute:\"2-digit\"})}. Les joueurs verront les changements d'ici une minute environ, en rechargeant la page.` : \"Rien à publier : le site est déjà à jour.\", \"ok\");\n    await refreshOnline();\n  } catch(e){ BUSY = false; setMsg(ghError(e), \"err\"); }\n}\nasync function installSite(){\n  BUSY = true; setMsg(\"Installation du site…\");\n  try {\n    let n = 0;\n    const files = { ...SITE_FILES };\n    if (SELF_HTML){\n      /* La page MJ se met elle-même en ligne, sauf si celle du site est plus récente. */\n      const o = await GH.get(\"mj.html\");\n      const ob = o && (o.text.match(/const BUILD = \"([^\"]*)\"/) || [])[1];\n      if (ob && /^\\d{4}-/.test(ob) && (!/^\\d{4}-/.test(BUILD) || ob > BUILD)){\n        BUSY = false;\n        setMsg(`La page MJ en ligne (version du ${buildLabel(ob)}) est plus récente que celle-ci (${buildLabel(BUILD)}). Rien n'a été modifié. Utilise plutôt la page en ligne : ${GH.siteUrl()}mj.html`, \"err\");\n        return;\n      }\n      files[\"mj.html\"] = SELF_HTML;\n    }\n    for (const [path, text] of Object.entries(files)){\n      const o = await GH.get(path);\n      if (o && o.text === text) continue;\n      await GH.put(path, text, o && o.sha, `Site : ${path}`); n++;\n    }\n    const repo = await GH.api(\"\");\n    let pages = await GH.api(\"/pages\", {allow404:true});\n    if (!pages){\n      try { pages = await GH.api(\"/pages\", { method:\"POST\", body: JSON.stringify({ source: { branch: repo.default_branch || \"main\", path: \"/\" } }) }); }\n      catch(e){ BUSY = false; setMsg(`Fichiers du site en place. Il reste à activer la publication : dans GitHub, Settings → Pages → Branch « ${repo.default_branch || \"main\"} » → Save.`, \"err\"); return; }\n    }\n    BUSY = false;\n    setMsg(`${n ? \"Site installé\" : \"Site déjà à jour\"}, page MJ en ligne comprise (version du ${buildLabel(BUILD)}). Adresse : ${GH.siteUrl()} (les changements peuvent mettre quelques minutes à apparaître).`, \"ok\");\n  } catch(e){ BUSY = false; setMsg(ghError(e), \"err\"); }\n}\nfunction renderPub(){\n  const box = $(\"#pub\"); if (!box) return;\n  const c = GH.cfg();\n  if (!GH.ready() || box.dataset.edit === \"1\"){\n    /* Vrai formulaire identifiant + mot de passe : le gestionnaire de mots de passe du téléphone ou du PC\n       propose d'enregistrer la clé, puis la remplit tout seul (onglet « grimoires »). */\n    box.innerHTML = `<form class=\"form\" id=\"ghForm\" action=\"#\" method=\"post\" autocomplete=\"on\">\n      <label>Nom d'utilisateur GitHub<input id=\"ghOwner\" name=\"username\" value=\"${esc(c.owner)}\" autocomplete=\"username\" autocapitalize=\"none\" spellcheck=\"false\"><\/label>\n      <label>Nom du dépôt<input id=\"ghRepo\" name=\"repo\" value=\"${esc(c.repo || \"grimoires\")}\" autocomplete=\"off\" autocapitalize=\"none\" spellcheck=\"false\"><\/label>\n      <label>Clé de publication<input id=\"ghToken\" name=\"password\" type=\"password\" value=\"${esc(c.token)}\" autocomplete=\"current-password\" spellcheck=\"false\" placeholder=\"github_pat_…\"><\/label>\n      <div class=\"row\"><button class=\"btn primary\" id=\"ghSave\" type=\"submit\">Enregistrer et tester<\/button>${GH.ready() ? '<button class=\"btn\" id=\"ghCancel\" type=\"button\">Annuler<\/button>' : \"\"}<\/div>\n      <p class=\"muted\" style=\"margin:0;font-size:.88rem\">La clé reste dans ce navigateur, sur cet appareil. Elle n'est envoyée qu'à GitHub. Accepte de l'enregistrer quand ton navigateur le propose : il la remplira tout seul la prochaine fois.<\/p>\n    <\/form><div class=\"msg ${PUB_CLS}\">${esc(PUB_MSG)}<\/div>`;\n    $(\"#ghForm\").onsubmit = async e => {\n      e.preventDefault();\n      const cfg = { owner: $(\"#ghOwner\").value.trim(), repo: $(\"#ghRepo\").value.trim() || \"grimoires\", token: $(\"#ghToken\").value.trim() };\n      if (!cfg.owner || !cfg.token) return setMsg(\"Renseigne le nom d'utilisateur et la clé.\", \"err\");\n      store.set(LS_GH, cfg);\n      try { await GH.api(\"\"); delete box.dataset.edit; setMsg(\"Connexion à GitHub réussie.\", \"ok\"); await refreshOnline(); }\n      catch(e){ box.dataset.edit = \"1\"; setMsg(ghError(e), \"err\"); }\n    };\n    const cc = $(\"#ghCancel\"); if (cc) cc.onclick = () => { delete box.dataset.edit; renderPub(); };\n    return;\n  }\n  box.innerHTML = `<p class=\"pubinfo\">Dépôt <strong>${esc(c.owner)}/${esc(c.repo)}<\/strong>, site <a href=\"${esc(GH.siteUrl())}\" target=\"_blank\" rel=\"noopener\">${esc(GH.siteUrl())}<\/a><br>\n    Page MJ en ligne (pour le téléphone) : <a href=\"${esc(GH.siteUrl())}mj.html\" target=\"_blank\" rel=\"noopener\">${esc(GH.siteUrl())}mj.html<\/a><\/p>\n    <div class=\"row\">\n      <button class=\"btn primary\" id=\"ghPublish\" ${BUSY || !M ? \"disabled\" : \"\"}>Publier<\/button>\n      <button class=\"btn\" id=\"ghRefresh\" ${BUSY ? \"disabled\" : \"\"}>Comparer avec le site<\/button>\n      <button class=\"btn\" id=\"ghInstall\" ${BUSY ? \"disabled\" : \"\"}>Installer / mettre à jour le site<\/button>\n      <button class=\"btn\" id=\"ghEdit\" ${BUSY ? \"disabled\" : \"\"}>Réglages<\/button>\n    <\/div><div class=\"msg ${PUB_CLS}\">${esc(PUB_MSG)}<\/div>`;\n  $(\"#ghPublish\").onclick = publish;\n  $(\"#ghRefresh\").onclick = () => { setMsg(\"\"); refreshOnline(); };\n  $(\"#ghInstall\").onclick = installSite;\n  $(\"#ghEdit\").onclick = () => { box.dataset.edit = \"1\"; setMsg(\"\"); };\n}\n\n/* ---------- player view ---------- */\nfunction slots(n, int){\n  if (!int) return \"\";\n  const total = Math.max(n, int);\n  let h = \"\";\n  for (let i = 0; i < total; i++) h += `<span class=\"slot ${i < n ? (i >= int ? \"over\" : \"on\") : \"\"}\"><\/span>`;\n  return `<div class=\"slots\" title=\"${n} sorts en mémoire sur ${int}\">${h}<span class=\"slots-label ${n>int?\"over\":\"\"}\">${n} / ${int} en mémoire<\/span><\/div>`;\n}\nfunction spellRow(s, g, extra=\"\"){\n  s = campSpell(s, curCampId());\n  const al = esc(s.alignment);\n  return `<button class=\"spell al-${al}\" data-spell=\"${esc(s.name)}\">\n    <span class=\"bar\"><\/span>\n    <span><span class=\"nm\">${g && g.memory ? '<span class=\"mem-mark\" title=\"En mémoire\"><\/span>' : \"\"}${esc(s.name)}<\/span>${extra}\n      <span class=\"meta\">${esc([s.type, s.range].filter(Boolean).join(\" · \"))}<\/span><\/span>\n    <span class=\"cost\">${esc(s.cost || \"—\")}<small>${s.cost ? \"PM\" : \"\"}<\/small><\/span>\n  <\/button>`;\n}\nfunction renderApp(keepScroll){\n  const app = $(\"#app\");\n  if (!M){\n    app.innerHTML = `<div class=\"nodata\">${MODE === \"site\" ? \"Chargement…\" : `Aucune donnée. Importe « Sorts du groupe.xlsx ».${MJ_FULL ? '<br><br><button class=\"btn primary\" data-import>Importer le fichier<\/button>' : \"\"}`}<\/div>`;\n    const ib = app.querySelector(\"[data-import]\"); if (ib) ib.onclick = () => $(\"#file\").click();\n    return;\n  }\n  const { camp, view, pc } = current();\n  if (!camp){ app.innerHTML = `<div class=\"nodata\">Aucune campagne dans le fichier.<\/div>`; return; }\n  const sc = app.querySelector(\".scroll\"); const st = keepScroll && sc ? sc.scrollTop : 0;\n  let inv = route().v === \"invoquer\";\n  if (inv && !canInvoke()){ history.replaceState(null, \"\", invHash()); inv = false; }\n  if (inv){\n    if (VIEW !== \"inv\"){ LIST_SCROLL = { win: window.scrollY, el: sc ? sc.scrollTop : 0 }; }\n    app.innerHTML = `<div class=\"scroll\">${renderInvoke(camp, pc)}<\/div>`;\n    if (keepScroll) app.querySelector(\".scroll\").scrollTop = st;\n    else { app.querySelector(\".scroll\").scrollTop = 0; if (VIEW !== \"inv\") window.scrollTo(0, 0); }\n    VIEW = \"inv\";\n    if (ELEM) bindInvoke(); else { const b = app.querySelector(\"[data-inv-back]\"); if (b) b.onclick = leaveInvoke; }\n    return;\n  }\n  const back = VIEW === \"inv\" && LIST_SCROLL; VIEW = \"list\";\n  if (current().mj){\n    const books = M.books.filter(b => norm(b.campaign) === norm(camp.name));\n    app.innerHTML = `\n    <div class=\"scroll\">\n      <header class=\"head\">\n        <div class=\"top\"><span class=\"camp\">${esc(camp.name)}${MJ_FULL ? M.campaigns.filter(c => c.id !== camp.id).map(c => ` · <a class=\"camp-alt\" href=\"#${encodeURIComponent(c.id)}/${MJ_ID}\">${esc(c.name)}<\/a>`).join(\"\") : \"\"}<\/span>\n          ${MJ_FULL ? '<button class=\"btn small\" data-import title=\"Importer une nouvelle version de « Sorts du groupe.xlsx »\">Importer<\/button>' : \"\"}<\/div>\n        <div class=\"pj\">Grimoire du MJ<\/div>\n        <div class=\"inv-who\">Tous les sorts, tous les grimoires, tous les ouvrages.<\/div>\n      <\/header>\n      ${ui.tab === \"grimoire\" ? renderMjGrimoire(camp) : renderMjLibrary(books)}\n    <\/div>\n    <nav class=\"tabs\" role=\"tablist\">\n      <button role=\"tab\" data-tab=\"grimoire\" aria-selected=\"${ui.tab===\"grimoire\"}\">Sorts <span class=\"muted\">${M.spells.length}<\/span><\/button>\n      <button role=\"tab\" data-tab=\"biblio\" aria-selected=\"${ui.tab===\"biblio\"}\">Bibliothèque <span class=\"muted\">${books.length}<\/span><\/button>\n    <\/nav>`;\n    if (keepScroll) app.querySelector(\".scroll\").scrollTop = st;\n    if (back){ const s = LIST_SCROLL; LIST_SCROLL = null; app.querySelector(\".scroll\").scrollTop = s.el; requestAnimationFrame(() => window.scrollTo(0, s.win)); }\n    bindApp();\n    return;\n  }\n  const mine = pc ? M.grimoires.filter(g => norm(g.pc) === norm(pc.name)) : [];\n  const memN = mine.filter(g => g.memory).length;\n  let body = \"\";\n  if (!pc) body = `<div class=\"nodata\">Pas encore de PJ dans cette campagne.<\/div>`;\n  else if (ui.tab === \"grimoire\") body = renderGrimoire(mine);\n  else body = renderLibrary(view, mine);\n  app.innerHTML = `\n    <div class=\"scroll\">\n      <header class=\"head\">\n        <div class=\"top\"><span class=\"camp\">${esc(camp.name)}<\/span><\/div>\n        <div class=\"pj\">${esc(pc ? pc.full : \"—\")}<\/div>\n        ${pc ? slots(memN, pc.int) : \"\"}\n      <\/header>\n      ${body}\n    <\/div>\n    <nav class=\"tabs\" role=\"tablist\">\n      <button role=\"tab\" data-tab=\"grimoire\" aria-selected=\"${ui.tab===\"grimoire\"}\">Grimoire${pc ? ` <span class=\"muted\">${mine.filter(g => !g.learning).length}<\/span>` : \"\"}<\/button>\n      <button role=\"tab\" data-tab=\"biblio\" aria-selected=\"${ui.tab===\"biblio\"}\">Bibliothèque <span class=\"muted\">${view.books.length}<\/span><\/button>\n    <\/nav>`;\n  if (keepScroll) app.querySelector(\".scroll\").scrollTop = st;\n  if (back){ const s = LIST_SCROLL; LIST_SCROLL = null; app.querySelector(\".scroll\").scrollTop = s.el; requestAnimationFrame(() => window.scrollTo(0, s.win)); }\n  bindApp();\n}\nconst FILTERS = [\n  { key:\"Chaos\", kind:\"al\" }, { key:\"Balance\", kind:\"al\" }, { key:\"Loi\", kind:\"al\" },\n  { key:\"Sort\", kind:\"form\" }, { key:\"Rune\", kind:\"form\" }, { key:\"Nécromancie\", kind:\"form\" }\n];\nfunction renderGrimoire(mine){\n  const blank = { type:\"\", alignment:\"\", form:\"\", cost:\"\", range:\"\", effects:\"\" };\n  const entries = mine.map(g => ({ g, s: M.spellBy.get(norm(g.spell)) || { ...blank, name: g.spell } }));\n  const learning = entries.filter(e => e.g.learning).sort((a,b) => norm(a.s.name).localeCompare(norm(b.s.name)));\n  const known = entries.filter(e => !e.g.learning);\n  const memN = known.filter(e => e.g.memory).length;\n  const q = norm(ui.q);\n  const alF = [...ui.al].map(norm), formF = [...ui.form].map(norm);\n  const match = ({g,s}) =>\n    (!alF.length || alF.includes(norm(s.alignment))) &&\n    (!formF.length || formF.includes(norm(s.form))) &&\n    (!q || norm(s.name + \" \" + s.effects + \" \" + g.incantation).includes(q));\n  const shown = known.filter(e => (!ui.mem || e.g.memory) && match(e))\n    .sort((a,b) => norm(a.s.name).localeCompare(norm(b.s.name)));\n  const learnShown = ui.mem ? [] : learning.filter(match);\n  let rows = \"\", last = \"\";\n  shown.forEach(({g,s}) => {\n    const L = norm(s.name).charAt(0).toUpperCase();\n    if (L !== last){ rows += `<div class=\"letter\">${L}<\/div>`; last = L; }\n    rows += spellRow(s, g);\n  });\n  const learnBlock = learnShown.length ? `<div class=\"learning\"><h3>En cours d'apprentissage<\/h3>${learnShown.map(({g,s}) =>\n      spellRow(s, g, g.progress ? `<span class=\"prog\">${esc(g.progress)}<\/span>` : \"\")).join(\"\")}<\/div>` : \"\";\n  const filtered = ui.q || ui.al.size || ui.form.size;\n  return `\n    <div class=\"tools\">\n      <div class=\"seg\" role=\"group\" aria-label=\"Sorts affichés\">\n        <button data-mem=\"1\" aria-pressed=\"${ui.mem}\">En mémoire<span class=\"n\">${memN}<\/span><\/button>\n        <button data-mem=\"0\" aria-pressed=\"${!ui.mem}\">Tous<span class=\"n\">${known.length}<\/span><\/button>\n      <\/div>\n      <input class=\"search\" id=\"q\" type=\"search\" placeholder=\"Chercher un sort, un effet…\" value=\"${esc(ui.q)}\" autocomplete=\"off\">\n      <div class=\"chips\">\n        ${FILTERS.map((f,i) => `${i === 3 ? '<span class=\"sep\"><\/span>' : \"\"}<button class=\"chip al-${esc(f.key)}\" data-${f.kind}=\"${esc(f.key)}\" aria-pressed=\"${(f.kind===\"al\"?ui.al:ui.form).has(f.key)}\">${esc(f.key)}<\/button>`).join(\"\")}\n      <\/div>\n    <\/div>\n    <div class=\"list\">${learnBlock}${rows || (learnBlock ? \"\" : `<div class=\"empty\">${ui.mem && !memN ? \"Aucun sort en mémoire.\" : \"Aucun sort ne correspond.\"}${filtered ? ' <button class=\"btn\" id=\"reset\">Effacer les filtres<\/button>' : \"\"}<\/div>`)}<\/div>`;\n}\nfunction campPcs(camp){ return M.pcs.filter(p => norm(p.campaign) === norm(camp.name)); }\nfunction knownBy(camp, spellName){\n  return campPcs(camp).map(p => ({ p, g: M.grimoires.find(g => norm(g.pc) === norm(p.name) && norm(g.spell) === norm(spellName)) })).filter(x => x.g);\n}\nfunction renderMjGrimoire(camp){\n  const pcs = campPcs(camp);\n  const sel = pcs.find(p => p.id === ui.mjPc) || null;\n  const LEARN = \"__apprentissage\", learnMode = ui.mjPc === LEARN;\n  const learning = M.grimoires.filter(g => g.learning && pcs.some(p => norm(p.name) === norm(g.pc)));\n  const learnSet = new Set(learning.map(g => norm(g.spell)));\n  const q = norm(ui.q), alF = [...ui.al].map(norm), formF = [...ui.form].map(norm);\n  let list = M.spells.slice();\n  if (learnMode) list = list.filter(s => learnSet.has(norm(s.name)));\n  if (sel){ const own = new Set(M.grimoires.filter(g => norm(g.pc) === norm(sel.name)).map(g => norm(g.spell))); list = list.filter(s => own.has(norm(s.name))); }\n  list = list.filter(s => (!alF.length || alF.includes(norm(s.alignment))) && (!formF.length || formF.includes(norm(s.form))) && (!q || norm(s.name + \" \" + s.effects).includes(q)))\n    .sort((a,b) => norm(a.name).localeCompare(norm(b.name)));\n  let rows = \"\", last = \"\";\n  list.forEach(s => {\n    const L = norm(s.name).charAt(0).toUpperCase();\n    if (L !== last){ rows += `<div class=\"letter\">${L}<\/div>`; last = L; }\n    let extra = \"\";\n    if (learnMode){\n      extra = `<span class=\"prog\">${learning.filter(g => norm(g.spell) === norm(s.name)).map(g => esc(g.pc) + (g.progress ? \" : \" + esc(g.progress) : \"\")).join(\"<br>\")}<\/span>`;\n    } else if (sel){\n      const g = M.grimoires.find(g => norm(g.pc) === norm(sel.name) && norm(g.spell) === norm(s.name));\n      extra = g.learning ? ' <span class=\"tag learning-tag\">en apprentissage<\/span>' : g.memory ? ' <span class=\"tag\">en mémoire<\/span>' : \"\";\n    } else {\n      const kb = knownBy(camp, s.name);\n      extra = `<span class=\"prog mj-who\">${kb.length ? kb.map(({p,g}) => esc(p.name) + (g.learning ? \" (appr.)\" : g.memory ? \" ◆\" : \"\")).join(\", \") : \"Aucun PJ\"}<\/span>`;\n    }\n    rows += spellRow(s, null, extra);\n  });\n  const filtered = ui.q || ui.al.size || ui.form.size;\n  return `\n    <div class=\"tools\">\n      <div class=\"chips mj-pcs\">\n        <button class=\"chip\" data-mjpc=\"\" aria-pressed=\"${!sel && !learnMode}\">Tous les sorts<\/button>\n        <button class=\"chip learn-chip\" data-mjpc=\"${LEARN}\" aria-pressed=\"${learnMode}\">En apprentissage <span class=\"n\">${learnSet.size}<\/span><\/button>\n        <span class=\"sep\"><\/span>\n        ${pcs.map(p => `<button class=\"chip\" data-mjpc=\"${esc(p.id)}\" aria-pressed=\"${sel && sel.id === p.id}\">${esc(p.name)}<\/button>`).join(\"\")}\n      <\/div>\n      <input class=\"search\" id=\"q\" type=\"search\" placeholder=\"Chercher un sort, un effet…\" value=\"${esc(ui.q)}\" autocomplete=\"off\">\n      <div class=\"chips\">\n        ${FILTERS.map((f,i) => `${i === 3 ? '<span class=\"sep\"><\/span>' : \"\"}<button class=\"chip al-${esc(f.key)}\" data-${f.kind}=\"${esc(f.key)}\" aria-pressed=\"${(f.kind===\"al\"?ui.al:ui.form).has(f.key)}\">${esc(f.key)}<\/button>`).join(\"\")}\n      <\/div>\n      ${sel || learnMode ? \"\" : '<p class=\"muted mj-legend\">◆ en mémoire · (appr.) en cours d\\'apprentissage<\/p>'}\n    <\/div>\n    <div class=\"list\">${rows || `<div class=\"empty\">${learnMode && !learnSet.size ? \"Aucun sort en cours d'apprentissage.\" : \"Aucun sort ne correspond.\"}${filtered ? ' <button class=\"btn\" id=\"reset\">Effacer les filtres<\/button>' : \"\"}<\/div>`}<\/div>`;\n}\nfunction renderMjLibrary(books){\n  if (!books.length) return `<div class=\"list\"><div class=\"empty\">Aucun ouvrage dans cette campagne.<\/div><\/div>`;\n  return `<div class=\"list\">${books.map(b => {\n    const sp = M.contents.filter(c => norm(c.book) === norm(b.name)).map(c => M.spellBy.get(norm(c.spell))).filter(Boolean)\n      .sort((a,b2) => norm(a.name).localeCompare(norm(b2.name)));\n    const mod = b.mod == null ? \"\" : (b.mod > 0 ? \"+\" + b.mod : b.mod === 0 ? \"±0\" : String(b.mod));\n    return `<details class=\"book\">\n      <summary><span class=\"bt\">${esc(b.name)}${b.revealed ? \"\" : ' <span class=\"tag hidden-tag\">non révélé<\/span>'}<\/span>\n        <span class=\"bm\">${esc([b.lang, mod && \"mod. \" + mod].filter(Boolean).join(\", \"))}<br>${sp.length} sorts<\/span><\/summary>\n      ${sp.map(s => spellRow(s, null)).join(\"\")}\n    <\/details>`;\n  }).join(\"\")}<\/div>`;\n}\nfunction renderLibrary(view, mine){\n  const known = new Set(mine.filter(g => !g.learning).map(g => norm(g.spell)));\n  const learning = new Set(mine.filter(g => g.learning).map(g => norm(g.spell)));\n  if (!view.books.length) return `<div class=\"list\"><div class=\"empty\">Le groupe n'a encore trouvé aucun ouvrage.<\/div><\/div>`;\n  return `<div class=\"list\">${view.books.map(b => {\n    const sp = M.contents.filter(c => norm(c.book) === norm(b.name)).map(c => M.spellBy.get(norm(c.spell))).filter(Boolean)\n      .sort((a,b2) => norm(a.name).localeCompare(norm(b2.name)));\n    const toLearn = sp.filter(s => !known.has(norm(s.name)) && !learning.has(norm(s.name))).length;\n    const mod = b.mod == null ? \"\" : (b.mod > 0 ? \"+\" + b.mod : b.mod === 0 ? \"±0\" : String(b.mod));\n    return `<details class=\"book\">\n      <summary><span class=\"bt\">${esc(b.name)}<\/span>\n        <span class=\"bm\">${esc([b.lang, mod && \"mod. \" + mod].filter(Boolean).join(\", \"))}<br>${sp.length} sorts, ${toLearn} à apprendre<\/span><\/summary>\n      ${sp.map(s => spellRow(s, mine.find(g => norm(g.spell)===norm(s.name)), known.has(norm(s.name)) ? ' <span class=\"tag\">connu<\/span>' : learning.has(norm(s.name)) ? ' <span class=\"tag learning-tag\">en apprentissage<\/span>' : ' <span class=\"tag learn\">à apprendre<\/span>')).join(\"\")}\n    <\/details>`;\n  }).join(\"\")}<\/div>`;\n}\nfunction openSpell(name){\n  const { view, pc, camp, mj } = current();\n  const s = campSpell(M.spellBy.get(norm(name)), curCampId()); if (!s) return;\n  const g = pc && M.grimoires.find(x => norm(x.pc)===norm(pc.name) && norm(x.spell)===norm(name));\n  const books = (mj ? M.books.filter(b => norm(b.campaign) === norm(camp.name)) : view.books).filter(b => M.contents.some(c => norm(c.book)===norm(b.name) && norm(c.spell)===norm(name)));\n  const kb = mj ? knownBy(camp, name) : [];\n  const mod = m => m == null ? \"\" : (m > 0 ? \"+\" + m : m === 0 ? \"±0\" : String(m));\n  const sheet = document.createElement(\"div\");\n  sheet.className = \"sheet\" + (isDesk() ? \"\" : \" fixed\");\n  sheet.innerHTML = `<div class=\"card al-${esc(s.alignment)}\" role=\"dialog\" aria-modal=\"true\" aria-label=\"${esc(s.name)}\">\n    <button class=\"x\" aria-label=\"Fermer\">×<\/button>\n    <h2>${esc(s.name)}<\/h2>\n    <div class=\"kind\">${esc(s.type || \"Type non renseigné\")}<\/div>\n    ${g ? (g.learning ? `<span class=\"statusline learn\">En cours d'apprentissage${g.progress ? \" : \" + esc(g.progress) : \"\"}<\/span>`\n      : `<span class=\"statusline ${g.memory?\"mem\":\"\"}\">${g.memory ? \"En mémoire\" : \"Connu, à consulter dans le grimoire\"}<\/span>`) : pc ? `<span class=\"statusline\">Pas dans le grimoire de ${esc(pc.name)}<\/span>` : \"\"}\n    <dl class=\"facts\">\n      <div><dt>Coût<\/dt><dd>${esc(s.cost || \"—\")}${s.cost ? \" PM\" : \"\"}<\/dd><\/div>\n      <div><dt>Portée<\/dt><dd>${esc(s.range || \"—\")}<\/dd><\/div>\n      <div><dt>Réf.<\/dt><dd>${esc(s.ref || \"—\")}<\/dd><\/div>\n    <\/dl>\n    ${g && g.incantation ? `<p class=\"incant\">${esc(g.incantation)}<\/p>` : \"\"}\n    <p class=\"effects\">${esc(s.effects || \"Pas de description.\")}<\/p>\n    ${isElemSpell(s.name) && canInvoke() ? invButton() : \"\"}\n    ${mj ? `<h3>Connu de<\/h3><p class=\"small\">${kb.length ? kb.map(({p,g}) => esc(p.name) + \" : \" + (g.learning ? \"en apprentissage\" + (g.progress ? \" (\" + esc(g.progress) + \")\" : \"\") : g.memory ? \"en mémoire\" : \"connu\")).join(\"<br>\") : \"Aucun PJ\"}<\/p>` : \"\"}\n    ${books.length ? `<h3>Se trouve dans<\/h3><p class=\"small\">${books.map(b => esc(b.name) + (b.lang||b.mod!=null ? ` (${esc([b.lang, b.mod!=null ? \"mod. \"+mod(b.mod) : \"\"].filter(Boolean).join(\", \"))})` : \"\") + (mj && !b.revealed ? \" — non révélé\" : \"\")).join(\"<br>\")}<\/p>`\n      : s.origin ? `<h3>Origine<\/h3><p class=\"small\">${esc(s.origin)}<\/p>` : \"\"}\n  <\/div>`;\n  const host = isDesk() ? $(\"#phone\") : document.body;\n  host.appendChild(sheet);\n  const close = () => { sheet.remove(); document.removeEventListener(\"keydown\", onKey); };\n  const onKey = e => { if (e.key === \"Escape\") close(); };\n  document.addEventListener(\"keydown\", onKey);\n  sheet.addEventListener(\"click\", e => { if (e.target === sheet || e.target.closest(\".x\")) close(); });\n  sheet.querySelector(\".x\").focus();\n  const ib = sheet.querySelector(\"[data-invoke]\"); if (ib) ib.onclick = () => { close(); goInvoke(); };\n}\nfunction bindApp(){\n  const app = $(\"#app\");\n  app.querySelectorAll(\"[data-tab]\").forEach(b => b.onclick = () => { ui.tab = b.dataset.tab; renderApp(); });\n  const q = app.querySelector(\"#q\");\n  if (q) q.oninput = () => { ui.q = q.value; const pos = q.selectionStart; renderApp(true); const nq = $(\"#app #q\"); nq.focus(); nq.setSelectionRange(pos,pos); };\n  app.querySelectorAll(\"[data-mem]\").forEach(b => b.onclick = () => { ui.mem = b.dataset.mem === \"1\"; renderApp(true); });\n  app.querySelectorAll(\"[data-al]\").forEach(b => b.onclick = () => { const v=b.dataset.al; ui.al.has(v)?ui.al.delete(v):ui.al.add(v); renderApp(true); });\n  app.querySelectorAll(\"[data-form]\").forEach(b => b.onclick = () => { const v=b.dataset.form; ui.form.has(v)?ui.form.delete(v):ui.form.add(v); renderApp(true); });\n  const r = app.querySelector(\"#reset\"); if (r) r.onclick = () => { ui.q=\"\"; ui.al.clear(); ui.form.clear(); renderApp(); };\n  app.querySelectorAll(\"[data-import]\").forEach(b => b.onclick = () => $(\"#file\").click());\n  app.querySelectorAll(\"[data-mjpc]\").forEach(b => b.onclick = () => { ui.mjPc = b.dataset.mjpc; renderApp(true); });\n  app.querySelectorAll(\"[data-spell]\").forEach(b => b.onclick = () => openSpell(b.dataset.spell));\n}\n\n/* ---------- invocation des élémentaires ---------- */\nconst ELEM_SPELL = \"Convoquer un Elémentaire\";\nconst ELEM_RULES_PATH = \"regles/elementaires.json\";\nconst LS_INV = \"grimoires.invocation.\";\nconst isElemSpell = n => norm(n) === norm(ELEM_SPELL);\nlet ELEM = null, ELEM_ERR = false, INV_FROM_APP = false, VIEW = \"list\", LIST_SCROLL = null;\n\nasync function loadElemRules(){\n  if (ELEM) return ELEM;\n  try {\n    if (SITE_FILES[ELEM_RULES_PATH]) ELEM = JSON.parse(SITE_FILES[ELEM_RULES_PATH]);\n    else { const r = await fetch(ELEM_RULES_PATH, { cache: \"no-cache\" }); if (r.ok) ELEM = await r.json(); }\n  } catch {}\n  ELEM_ERR = !ELEM;\n  return ELEM;\n}\n/* Accès à l'invocation :\n   \"full\"  : le grimoire du MJ, ou un PJ qui connaît le sort ;\n   \"essai\" : un PJ qui l'a en cours d'apprentissage, ou qui peut le trouver dans un ouvrage révélé à sa campagne\n             (simulation pour découvrir le sort, rangée à part) ;\n   null    : pas d'accès. */\nfunction invAccess(){\n  if (isMjView()) return \"full\";\n  const { pc, view } = current();\n  if (!pc) return null;\n  const g = M.grimoires.find(g => norm(g.pc) === norm(pc.name) && isElemSpell(g.spell));\n  if (g && !g.learning) return \"full\";\n  if (g) return \"essai\";\n  const inBook = view.books.some(b => M.contents.some(c => norm(c.book) === norm(b.name) && isElemSpell(c.spell)));\n  return inBook ? \"essai\" : null;\n}\nconst canInvoke = () => !!invAccess();\nfunction invKey(){ const { camp, pc } = current(); if (isMjView()) return LS_INV + \"mj/\" + (camp ? camp.id : \"\");\n  if (invAccess() === \"essai\") return LS_INV + \"essai/\" + (camp ? camp.id : \"\") + \"/\" + (pc ? pc.id : \"\"); return LS_INV + (camp ? camp.id : \"\") + \"/\" + (pc ? pc.id : \"\"); }\nfunction invState(){\n  const st = Object.assign({ elem:\"Gnome\", pm:21, mode:\"libre\", up:{}, tab:\"prep\", sheet:null }, store.get(invKey()) || {});\n  const cv = pmConv();\n  if (cv){\n    /* La dépense affichée (st.spent) est convertie en PM de la table (st.pm), sans que le joueur le voie. */\n    if (st.spent == null) st.spent = cv.min + Math.max(0, Math.ceil((st.pm - cv.base) / cv.perPoint));\n    st.spent = Math.min(cv.max, Math.max(cv.min, st.spent));\n    st.pm = toTablePM(st.spent);\n    trimUp(st);\n  }\n  return st;\n}\nfunction invSave(st){ store.set(invKey(), st); }\nfunction invHash(extra){\n  const r = route(), cur = M ? current() : {};\n  const c = r.c || (cur.camp ? cur.camp.id : \"\"), p = r.p || (cur.pc ? cur.pc.id : \"-\");\n  return \"#\" + [c, p, extra].filter(x => x != null && x !== \"\").map(encodeURIComponent).join(\"/\");\n}\nfunction goInvoke(){ INV_FROM_APP = true; location.hash = invHash(\"invoquer\"); }\nfunction leaveInvoke(){\n  if (INV_FROM_APP){ INV_FROM_APP = false; history.back(); }\n  else location.replace(invHash());\n}\n\n/* règles */\n/* Conversion des PM dépensés en PM de la table (règle de campagne « pm ») ; null = PM de la table saisis directement. */\nfunction pmConv(){ const r = campRule(); return r && r.pm ? r.pm : null; }\nfunction toTablePM(spent){ const cv = pmConv(); return cv ? cv.base + cv.perPoint * (spent - cv.min) : spent; }\nfunction pmRange(){ const cv = pmConv(); return cv ? { min: cv.min, max: cv.max } : { min: ELEM.pmMin, max: ELEM.pmMax }; }\nconst shownPM = st => pmConv() ? st.spent : st.pm;\nconst sheetPM = sh => sh.spent != null ? sh.spent : sh.pm;\nconst freeWord = () => pmConv() ? \"point\" : \"PM\";\nconst freeWords = () => pmConv() ? \"points\" : \"PM\";\nfunction trimUp(st){\n  const total = freePM(st.pm);\n  while (usedPM(st.up) > total){ const k = Object.keys(st.up).filter(k => st.up[k] > 0).pop(); st.up[k]--; if (!st.up[k]) delete st.up[k]; }\n}\n/* Règle propre à une campagne (regles/elementaires.json → campaignRules) : chances des compétences et attaques.\n   Les dommages se calculent toujours comme si chaque PM ajoutait 10 % (dmgPct). */\nfunction campRule(){ const { camp } = current(); return (ELEM && ELEM.campaignRules && camp && ELEM.campaignRules[camp.id]) || null; }\nfunction skillPct(base, n, rule){\n  let v = base;\n  for (let k = 0; k < n; k++) v += rule ? (v + rule.step > rule.cap ? rule.stepOver : rule.step) : 10;\n  return v;\n}\nconst dmgPct = (base, n) => base + n*10;\nconst stepLabel = rule => rule ? \"+\" + rule.step + \"%\" : \"+10%\";\nconst stepSub = rule => rule ? `+${rule.stepOver}% au-delà de ${rule.cap}%` : \"\";\nconst pmIdx = pm => pm < 30 ? 0 : pm - 29;\nconst freePM = pm => pm < 30 ? pm - 21 : 8;\nconst STATS6 = [\"STR\",\"CON\",\"SIZ\",\"INT\",\"POW\",\"DEX\"];\nconst frMov = m => ({Run:\"course\",Jump:\"saut\",Fly:\"vol\",Swim:\"nage\"}[m] || m);\nconst frSkill = sk => /^Ways of/.test(sk) ? \"Art : \" + sk : sk;\nconst rollD6 = n => { let s = 0; for (let i = 0; i < n; i++) s += 1 + Math.floor(Math.random()*6); return s; };\nconst usedPM = up => Object.values(up).reduce((a,b) => a + b, 0);\nfunction catalogue(R, rule){\n  const l = [\n    {key:\"STR\", label:\"STR +1D6\", cap:Infinity}, {key:\"CON\", label:\"CON +1D6\", cap:Infinity}, {key:\"SIZ\", label:\"SIZ +1D6\", cap:Infinity},\n    {key:\"INT\", label:\"INT +1D6\", sub:\"une fois au plus\", cap:1}\n  ];\n  if (R.canDex) l.push({key:\"DEX\", label:\"DEX +1D6\", sub:\"une fois au plus\", cap:1});\n  Object.keys(R.mov).forEach(m => l.push({key:\"MOV:\"+m, label:`MOV (${frMov(m)}) +2`, cap:Infinity}));\n  Object.keys(R.rolls).forEach(r => l.push({key:\"ROLL:\"+r, label:`${r} ${stepLabel(rule)}`, sub:stepSub(rule), cap:Infinity}));\n  R.fixedSkills.forEach(([sk]) => l.push({key:\"SKILL:\"+sk, label:`${frSkill(sk)} ${stepLabel(rule)}`, sub:stepSub(rule), cap:Infinity}));\n  l.push({key:\"LANG\", label:`Langue de l'invocateur ${stepLabel(rule)}`, sub:\"base INT×2\" + (rule ? \", \" + stepSub(rule) : \"\"), cap:Infinity});\n  return l;\n}\nfunction projection(R, pm, up, key, rule){\n  const i = pmIdx(pm), c = up[key] || 0;\n  if (STATS6.includes(key)){ const s = R.stats[key], b = s.bonus ? \"+\" + s.bonus : \"\"; return { base:s.min[i]+\"D6\"+b, now:(s.min[i]+c)+\"D6\"+b }; }\n  if (key.startsWith(\"MOV:\")){ const v = R.mov[key.slice(4)][i]; return { base:\"\"+v, now:\"\"+(v+c*2) }; }\n  if (key.startsWith(\"ROLL:\")){ const v = R.rolls[key.slice(5)][i]; return { base:v+\"%\", now:skillPct(v, c, rule)+\"%\" }; }\n  if (key.startsWith(\"SKILL:\")){ const e = R.fixedSkills.find(s => s[0] === key.slice(6)); const v = e ? e[1] : 0; return { base:v+\"%\", now:skillPct(v, c, rule)+\"%\" }; }\n  if (key === \"LANG\") return { base:\"INT×2\", now: !c ? \"INT×2\" : rule ? `INT×2, ${c} PM` : \"INT×2 +\" + c*10 + \"%\" };\n  return { base:\"\", now:\"\" };\n}\nfunction impactDB(v){\n  const t = [[1,4,\"-5\"],[5,8,\"-4\"],[9,12,\"-3\"],[13,15,\"-2\"],[16,18,\"-1\"],[19,23,\"0\"],[24,26,\"+1\"],[27,29,\"+2\"],[30,33,\"+3\"],[34,37,\"+4\"],[38,41,\"+5\"]];\n  for (const [a,b,x] of t) if (v >= a && v <= b) return x;\n  if (v < 1) return \"-5\";\n  if (v <= 53) return \"2D6\";\n  return (Math.floor((v - 54) / 14) + 3) + \"D6\";\n}\nfunction attackDamage(pct){\n  const S = {0:\"\",10:\"1D2\",20:\"1D4\",30:\"1D6\",40:\"1D8\"};\n  if (pct <= 0) return \"—\";\n  const d10 = Math.floor(pct/50), r = Math.floor((pct % 50)/10)*10;\n  if (!d10) return S[r] || \"1D2\";\n  return d10 + \"D10\" + (S[r] ? \"+\" + S[r] : \"\");\n}\nfunction withDB(base, imp){\n  if (!imp || imp === \"0\") return base;\n  if (/D6/.test(imp)){\n    const n = parseInt(imp, 10), t = base.split(\"+\");\n    const i = t.findIndex(x => /^\\d+D6$/.test(x));\n    if (i >= 0){ t[i] = (parseInt(t[i], 10) + n) + \"D6\"; return t.join(\"+\"); }\n    return base + \"+\" + imp;\n  }\n  return imp[0] === \"-\" ? base + \"−\" + imp.slice(1) : base + \"+\" + imp.replace(/^\\+/, \"\");\n}\nconst doubleDice = f => f.split(\"+\").map(x => { const m = x.match(/^(\\d+)D(\\d+)$/); return m ? (m[1]*2) + \"D\" + m[2] : x; }).join(\"+\");\nfunction attackCount(elem, major, dex){\n  let n = major ? Math.floor((dex - 1) / 5) + 1 : 1;\n  return elem === \"Gnome\" ? Math.max(2, n) : n;\n}\nfunction dmgPair(R, atk, pct, imp){\n  const base = attackDamage(pct), db = R.dbAttacks.includes(atk);\n  return db ? `${withDB(base, imp)} / ${withDB(doubleDice(base), imp)}` : `${base} / ${doubleDice(base)}`;\n}\nfunction conjure(st){\n  const R = ELEM.elementals[st.elem], i = pmIdx(st.pm), vals = {};\n  STATS6.forEach(s => { const n = R.stats[s].min[i] + (s === \"POW\" ? 0 : (st.up[s] || 0)); vals[s] = rollD6(n) + R.stats[s].bonus; });\n  st.sheet = { elem: st.elem, pm: st.pm, spent: pmConv() ? st.spent : null, up: { ...st.up }, vals, hpLoss: 0, rule: campRule() };\n  st.tab = \"fiche\";\n}\nfunction randomUp(st){\n  const R = ELEM.elementals[st.elem], cat = catalogue(R), total = freePM(st.pm);\n  st.up = {};\n  for (let k = 0; k < total; k++){\n    const av = cat.filter(u => (st.up[u.key] || 0) < u.cap);\n    if (!av.length) break;\n    const u = av[Math.floor(Math.random()*av.length)];\n    st.up[u.key] = (st.up[u.key] || 0) + 1;\n  }\n}\n\n/* rendu */\nfunction invButton(){\n  const st = store.get(invKey()), sh = st && st.sheet, essai = invAccess() === \"essai\";\n  const cls = \"btn-invoke\" + (essai ? \" essai\" : \"\");\n  if (sh){\n    const max = sh.vals.CON + sh.vals.SIZ;\n    return `<button class=\"${cls}\" data-invoke><span><b>${essai ? \"Reprendre la simulation\" : \"Reprendre l'élémentaire\"}<\/b><small>${esc(sh.elem)} · ${sheetPM(sh)} PM · HP ${max - (sh.hpLoss||0)} / ${max}<\/small><\/span><span class=\"go\">›<\/span><\/button>`;\n  }\n  if (essai) return `<button class=\"${cls}\" data-invoke><span><b>Découvrir l'invocation<\/b><small>Sort pas encore appris : simuler un élémentaire pour voir comment il fonctionne<\/small><\/span><span class=\"go\">›<\/span><\/button>`;\n  return `<button class=\"${cls}\" data-invoke><span><b>Invoquer un élémentaire<\/b><small>Choisir l'élémentaire et répartir les PM<\/small><\/span><span class=\"go\">›<\/span><\/button>`;\n}\nfunction renderInvoke(camp, pc){\n  if (!ELEM){\n    if (!ELEM_ERR) loadElemRules().then(() => { if (route().v === \"invoquer\") renderApp(); });\n    return `<div class=\"nodata\">${ELEM_ERR ? \"Les règles d'invocation n'ont pas pu être chargées. Vérifie la connexion puis recharge la page.\" : \"Chargement…\"}<\/div>`;\n  }\n  const st = invState();\n  if (st.tab === \"fiche\" && !st.sheet) st.tab = \"prep\";\n  const who = pc ? pc.full : \"\";\n  return `\n    <header class=\"head\">\n      <div class=\"top\"><button class=\"inv-back\" data-inv-back>‹ Sorts<\/button><span class=\"camp\">${esc(camp.name)}<\/span><\/div>\n      <div class=\"pj\">Invocation<\/div>\n      ${who ? `<div class=\"inv-who\">${esc(who)}<\/div>` : \"\"}\n      ${invAccess() === \"essai\" ? `<div class=\"inv-essai\">Simulation : ${esc(pc ? pc.name : \"\")} n'a pas encore appris le sort. L'élémentaire simulé est rangé à part et ne sera pas repris une fois le sort appris.<\/div>` : \"\"}\n      <div class=\"seg\" role=\"group\" aria-label=\"Invocation\">\n        <button data-inv-tab=\"prep\" aria-pressed=\"${st.tab === \"prep\"}\">Préparer<\/button>\n        <button data-inv-tab=\"fiche\" aria-pressed=\"${st.tab === \"fiche\"}\" ${st.sheet ? \"\" : \"disabled\"}>Élémentaire${st.sheet ? `<span class=\"n\">${esc(st.sheet.elem)}<\/span>` : \"\"}<\/button>\n      <\/div>\n    <\/header>\n    <div class=\"inv\">${st.tab === \"fiche\" ? renderSheet(st) : renderPrep(st)}<\/div>`;\n}\nfunction renderPrep(st){\n  const R = ELEM.elementals[st.elem], rule = campRule(), total = freePM(st.pm), used = usedPM(st.up), left = total - used;\n  const cards = Object.entries(ELEM.elementals).map(([k,d]) => `<button class=\"el-card el-${esc(d.color)}\" data-inv-el=\"${esc(k)}\" aria-pressed=\"${k === st.elem}\">\n      <img src=\"${d.img}\" alt=\"\"><span class=\"nm\">${esc(d.name)}<\/span><span class=\"sub\">${esc(d.element)}<\/span><\/button>`).join(\"\");\n  let pips = \"\";\n  for (let i = 0; i < 8; i++) pips += `<span class=\"slot ${i >= total ? \"off\" : i < used ? \"on\" : \"\"}\"><\/span>`;\n  /* Caractéristiques : améliorables (catalogue) ou fixes (POW, DEX des gnomes…), affichées dans l'ordre STR→DEX. */\n  const cat = catalogue(R, rule), iP = pmIdx(st.pm);\n  const fixedStat = s => { const d = R.stats[s]; return { fixed: true, key: s, dice: d.min[iP] + \"D6\" + (d.bonus ? \"+\" + d.bonus : \"\") }; };\n  const ordered = [...STATS6.map(s => cat.find(u => u.key === s) || fixedStat(s)), ...cat.filter(u => !STATS6.includes(u.key))];\n  const upgRows = ordered.map(u => {\n    if (u.fixed) return `<div class=\"upg info\"><div class=\"nm\">${u.key}<small>suit la table, non améliorable<\/small><\/div><div class=\"proj\"><b>${u.dice}<\/b><\/div><div><\/div><\/div>`;\n    const c = st.up[u.key] || 0, p = projection(R, st.pm, st.up, u.key, rule);\n    let dmg = \"\";\n    if (u.key.startsWith(\"ROLL:\") && u.key !== \"ROLL:Dodge\"){\n      const atk = u.key.slice(5), pct = dmgPct(R.rolls[atk][pmIdx(st.pm)], c);\n      dmg = `<span class=\"dmg\">${dmgPair(R, atk, pct, \"DB\")}${R.rangedAttacks.includes(atk) ? \" · portée DB\" : \"\"}<\/span>`;\n    }\n    return `<div class=\"upg ${c ? \"on\" : \"\"}\"><div class=\"nm\">${esc(u.label)}${u.sub ? `<small>${esc(u.sub)}<\/small>` : \"\"}<\/div>\n      <div class=\"proj\">${c ? `<s>${esc(p.base)}<\/s> → ` : \"\"}<b>${esc(p.now)}<\/b>${dmg}<\/div>\n      <div class=\"ctl\"><button class=\"round\" data-inv-up=\"${esc(u.key)}\" data-d=\"-1\" ${c <= 0 ? \"disabled\" : \"\"} aria-label=\"Retirer\">−<\/button><span class=\"c\">${c}<\/span>\n        <button class=\"round\" data-inv-up=\"${esc(u.key)}\" data-d=\"1\" ${left <= 0 || c >= u.cap ? \"disabled\" : \"\"} aria-label=\"Ajouter\">+<\/button><\/div><\/div>`;\n  }).join(\"\");\n  const drown = R.hasDrown ? `<div class=\"upg info\"><div class=\"nm\">Drown by Touch<small>STR×3, non améliorable<\/small><\/div><div class=\"proj\"><b>1D6 / 2D6<\/b><\/div><div><\/div><\/div>` : \"\";\n  const replace = st.sheet ? `<p class=\"note\">Un ${esc(st.sheet.elem.toLowerCase())} est déjà invoqué : le manifester à nouveau le remplacera.<\/p>` : \"\";\n  return `\n    <h3>L'élémentaire convoqué<\/h3>\n    <div class=\"el-grid\">${cards}<\/div>\n    <details class=\"el-traits el-${esc(R.color)}\"><summary>Résistance et particularités<\/summary>\n      <ul>${R.resist.map(r => `<li>${esc(r)}<\/li>`).join(\"\")}<\/ul><p>${esc(R.note)}<\/p><\/details>\n    <h3>Points de magie investis<\/h3>\n    <div class=\"pm-row\">\n      <button class=\"round\" data-inv-pm=\"-1\" ${shownPM(st) <= pmRange().min ? \"disabled\" : \"\"} aria-label=\"Un PM de moins\">−<\/button>\n      <input type=\"range\" id=\"invPm\" min=\"${pmRange().min}\" max=\"${pmRange().max}\" step=\"1\" value=\"${shownPM(st)}\" aria-label=\"PM investis\">\n      <button class=\"round\" data-inv-pm=\"1\" ${shownPM(st) >= pmRange().max ? \"disabled\" : \"\"} aria-label=\"Un PM de plus\">+<\/button>\n      <div class=\"val\"><span id=\"invPmVal\">${shownPM(st)}<\/span><small>PM<\/small><\/div>\n    <\/div>\n    <div class=\"pm-free\">${pips}<span class=\"slots-label\">${used} / ${total} ${freeWords()} libres répartis<\/span><\/div>\n    ${pmConv() ? (total ? `<p class=\"note\">L'élémentaire est ${st.pm >= 30 ? \"majeur\" : \"mineur\"} ; ${total} point${total > 1 ? \"s\" : \"\"} libre${total > 1 ? \"s\" : \"\"} à répartir.<\/p>` : `<p class=\"note\">À ${st.spent} PM, l'élémentaire est mineur et aucun point libre n'est à répartir.<\/p>`) : \"\"}\n    ${!pmConv() && st.pm > 21 && st.pm < 30 ? `<p class=\"note\">Entre 22 et 29 PM, les minima restent ceux de 21 PM ; les ${total} PM au-delà se répartissent librement.<\/p>` : \"\"}\n    ${!pmConv() && st.pm >= 30 ? `<p class=\"note\">À partir de 30 PM, l'élémentaire est majeur ; les minima suivent la table et 8 PM restent à répartir.<\/p>` : \"\"}\n    <h3>Répartition des ${freeWords()} libres<\/h3>\n    <div class=\"seg\" role=\"group\" aria-label=\"Mode de répartition\">\n      <button data-inv-mode=\"libre\" aria-pressed=\"${st.mode === \"libre\"}\">Libre<\/button>\n      <button data-inv-mode=\"alea\" aria-pressed=\"${st.mode === \"alea\"}\">Aléatoire<\/button>\n    <\/div>\n    ${rule ? `<p class=\"note\">Chaque ${freeWord()} libre investi dans une compétence ou une attaque ajoute ${rule.step}% aux chances (${rule.stepOver}% au-delà de ${rule.cap}%). Les dommages des attaques se calculent comme si chaque ${freeWord()} ajoutait 10%.<\/p>` : \"\"}\n    ${st.mode === \"libre\" ? `<div>${upgRows}${drown}<\/div>`\n      : `<p class=\"note\">Les ${total} ${freeWords() const SELF_HTML = MODE === "mj" ? "<!doctype html>\n" + document.documentElement.outerHTML + "\n" : "";
const buildLabel = b => /^\d{4}-/.test(b) ? new Date(b).toLocaleString("fr-FR", { day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit" }) : b;
const LS_CUR = "grimoires.current", LS_PREV = "grimoires.previous", LS_GH = "grimoires.github", LS_ROUTE = "grimoires.lastRoute";

/* ---------- utils ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s ?? "").replace(/Œ/g,"Oe").replace(/œ/g,"oe").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/\s+/g," ").trim();
const slug = s => norm(s).replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const yes = v => /^(oui|o|yes|1|vrai|x)$/i.test(String(v ?? "").trim());
const str = v => v == null ? "" : String(v).trim();
const b64enc = s => { const b = new TextEncoder().encode(s); let x = ""; for (let i = 0; i < b.length; i += 0x8000) x += String.fromCharCode(...b.subarray(i, i + 0x8000)); return btoa(x); };
const b64dec = s => new TextDecoder().decode(Uint8Array.from(atob(String(s).replace(/\s/g,"")), c => c.charCodeAt(0)));
const isDesk = () => MODE === "mj" && !$("#desk").classList.contains("player-only") && matchMedia("(min-width: 861px)").matches;
const store = {
  get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

/* ---------- parsing ---------- */
function readSheet(wb, name){
  const key = Object.keys(wb.Sheets).find(n => norm(n) === norm(name));
  if (!key) return null;
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[key], {defval:null, raw:true});
  // normalise headers: lowercase, accents removed, text before "(" kept
  return rows.map(r => {
    const o = {};
    for (const [h,v] of Object.entries(r)) o[norm(h).replace(/\s*\(.*$/,"")] = typeof v === "string" ? v.trim() : v;
    return o;
  }).filter(o => Object.values(o).some(v => v !== null && v !== ""));
}
function parseType(t){
  const m = /^\s*([^()]+?)\s*(?:\((.+)\))?\s*$/.exec(t || "");
  return { alignment: m ? m[1] : "", form: m && m[2] ? m[2] : "" };
}
function parseWorkbook(wb){
  const missing = ["Campagnes","PJ","Ouvrages","Contenu","Sorts","Grimoires"].filter(n => !readSheet(wb,n));
  if (missing.length) throw new Error("Onglet(s) manquant(s) : " + missing.join(", "));
  const campaigns = readSheet(wb,"Campagnes").filter(r => r.campagne).map(r => ({
    name: str(r.campagne), id: str(r.identifiant) || slug(r.campagne), active: r.active == null ? true : yes(r.active)
  }));
  const pcs = readSheet(wb,"PJ").filter(r => r.pj).map(r => ({
    campaign: str(r.campagne), name: str(r.pj), full: str(r["nom complet"]) || str(r.pj),
    id: str(r.identifiant) || slug(r.pj), int: Number(r.int) || 0, active: r.actif == null ? true : yes(r.actif)
  }));
  const books = readSheet(wb,"Ouvrages").filter(r => r.ouvrage).map(r => ({
    campaign: str(r.campagne), name: str(r.ouvrage), lang: str(r.langue),
    mod: r.modificateur == null || r.modificateur === "" ? null : Number(r.modificateur),
    revealed: yes(r.revele), notes: str(r.notes)
  }));
  const contents = readSheet(wb,"Contenu").filter(r => r.ouvrage && r.sort).map(r => ({ book: str(r.ouvrage), spell: str(r.sort), notes: str(r.notes) }));
  const spells = readSheet(wb,"Sorts").filter(r => r.sort).map(r => {
    const t = parseType(str(r["type de magie"]));
    return { name: str(r.sort), cost: str(r.cout), type: str(r["type de magie"]), alignment: t.alignment, form: t.form,
             ref: str(r["ref."] ?? r.ref), range: str(r.portee), effects: str(r.effets), origin: str(r["origine"]) };
  });
  const grimoires = readSheet(wb,"Grimoires").filter(r => r.pj && r.sort).map(r => ({
    pc: str(r.pj), spell: str(r.sort), memory: norm(r.statut).includes("memoire"), learning: norm(r.statut).includes("apprentissage"),
    progress: str(r.progression), incantation: str(r.incantation)
  }));
  return { campaigns, pcs, books, contents, spells, grimoires, importedAt: new Date().toISOString() };
}

/* ---------- model & checks ---------- */
function buildModel(data){
  const spellBy = new Map(data.spells.map(s => [norm(s.name), s]));
  const issues = [];
  const dup = (arr, f, label) => { const seen = new Set(); arr.forEach(x => { const k = norm(f(x)); if (seen.has(k)) issues.push(`${label} en double : « ${f(x)} »`); seen.add(k); }); };
  dup(data.spells, s => s.name, "Sort");
  dup(data.pcs, p => p.name, "PJ");
  dup(data.campaigns, c => c.name, "Campagne");
  dup(data.books, b => b.campaign + " / " + b.name, "Ouvrage");
  const campNames = new Set(data.campaigns.map(c => norm(c.name)));
  data.pcs.forEach(p => { if (!campNames.has(norm(p.campaign))) issues.push(`PJ ${p.name} : campagne « ${p.campaign} » inconnue`); });
  data.books.forEach(b => { if (!campNames.has(norm(b.campaign))) issues.push(`Ouvrage ${b.name} : campagne « ${b.campaign} » inconnue`); });
  const pcBy = new Map(data.pcs.map(p => [norm(p.name), p]));
  data.grimoires.forEach(g => {
    if (!pcBy.has(norm(g.pc))) issues.push(`Grimoires : PJ « ${g.pc} » inconnu`);
    if (!spellBy.has(norm(g.spell))) issues.push(`Grimoires : sort « ${g.spell} » (${g.pc}) absent du catalogue`);
  });
  const bookNames = new Set(data.books.map(b => norm(b.name)));
  data.contents.forEach(c => {
    if (!bookNames.has(norm(c.book))) issues.push(`Contenu : ouvrage « ${c.book} » absent de l'onglet Ouvrages`);
    if (!spellBy.has(norm(c.spell))) issues.push(`Contenu : sort « ${c.spell} » (${c.book}) absent du catalogue`);
  });
  data.books.forEach(b => { if (!data.contents.some(c => norm(c.book) === norm(b.name))) issues.push({info:true, text:`Ouvrage ${b.name} (${b.campaign}) : aucun sort dans Contenu`}); });
  data.spells.forEach(s => { if (!s.type) issues.push({info:true, text:`Sort ${s.name} : type de magie vide`}); });
  data.pcs.forEach(p => {
    const mem = data.grimoires.filter(g => norm(g.pc) === norm(p.name) && g.memory).length;
    if (p.int && mem > p.int) issues.push(`${p.name} : ${mem} sorts en mémoire pour une INT de ${p.int}`);
  });
  data.grimoires.forEach(g => { if (g.progress && !g.learning) issues.push({info:true, text:`${g.pc} : progression renseignée sur ${g.spell}, qui n'est pas en apprentissage`}); });
  const ids = new Map(); data.pcs.forEach(p => { const k = norm(p.campaign)+"/"+p.id; if (ids.has(k)) issues.push(`Identifiant de lien « ${p.id} » utilisé deux fois dans ${p.campaign}`); ids.set(k,1); });
  return { ...data, spellBy, pcBy, issues };
}

/* What a given campaign can see */
function campaignView(M, campName){
  const pcs = M.pcs.filter(p => norm(p.campaign) === norm(campName) && p.active);
  const pcSet = new Set(pcs.map(p => norm(p.name)));
  const books = M.books.filter(b => norm(b.campaign) === norm(campName) && b.revealed);
  const bookSet = new Set(books.map(b => norm(b.name)));
  const visible = new Set();
  M.grimoires.forEach(g => { if (pcSet.has(norm(g.pc))) visible.add(norm(g.spell)); });
  M.contents.forEach(c => { if (bookSet.has(norm(c.book))) visible.add(norm(c.spell)); });
  return { pcs, books, visible };
}

/* ---------- variantes de sorts propres à une campagne ---------- */
/* Le catalogue de sorts est commun aux campagnes. Une campagne dont la règle d'invocation fixe
   sa propre dépense (regles/elementaires.json → campaignRules.<id>.pm) affiche ce minimum pour
   « Convoquer un Elémentaire ». Appliqué à la publication et à l'affichage. */
function rulesSync(){
  if (!ELEM && SITE_FILES[ELEM_RULES_PATH]) { try { ELEM = JSON.parse(SITE_FILES[ELEM_RULES_PATH]); } catch {} }
  return ELEM;
}
function campSpell(s, campId){
  const R = rulesSync(), r = R && R.campaignRules && R.campaignRules[campId];
  if (s && r && r.pm && isElemSpell(s.name)) return { ...s, cost: r.pm.min + " minimum" };
  return s;
}
function curCampId(){ const r = route(); if (r.c) return r.c; const c = current().camp; return c ? c.id : ""; }

/* ---------- what gets published: one file per active campaign ---------- */
function publishedViews(M){
  return M.campaigns.filter(c => c.active).map(c => {
    const v = campaignView(M, c.name);
    const pcN = new Set(v.pcs.map(p => norm(p.name)));
    const bN = new Set(v.books.map(b => norm(b.name)));
    return { id: c.id, name: c.name, data: {
      campaigns: [{ name: c.name, id: c.id, active: true }],
      pcs: v.pcs.map(({campaign,name,full,id,int}) => ({campaign,name,full,id,int,active:true})),
      books: v.books.map(({campaign,name,lang,mod}) => ({campaign,name,lang,mod,revealed:true})),
      contents: M.contents.filter(x => bN.has(norm(x.book))).map(({book,spell}) => ({book,spell})),
      spells: M.spells.filter(s => v.visible.has(norm(s.name))).map(s => campSpell(s, c.id)),
      grimoires: M.grimoires.filter(g => pcN.has(norm(g.pc)))
    }};
  });
}
function mergeViews(views){
  const m = { campaigns:[], pcs:[], books:[], contents:[], spells:[], grimoires:[] }, sS = new Set(), sC = new Set();
  views.forEach(({data:d}) => {
    m.campaigns.push(...d.campaigns); m.pcs.push(...d.pcs); m.books.push(...d.books); m.grimoires.push(...d.grimoires);
    d.spells.forEach(s => { const k = norm(s.name); if (!sS.has(k)) { sS.add(k); m.spells.push(s); } });
    d.contents.forEach(c => { const k = norm(c.book)+"|"+norm(c.spell); if (!sC.has(k)) { sC.add(k); m.contents.push(c); } });
  });
  return m;
}

/* ---------- diff (on what players see) ---------- */
const ws = v => String(v ?? "").replace(/\s+/g," ").trim();
function diff(prev, cur){
  if (!prev) return null;
  if (!prev.campaigns.length) return `<p>Première publication : ${cur.campaigns.length} campagne(s), ${cur.pcs.length} PJ, ${cur.spells.length} sorts visibles.</p>`;
  const out = [];
  const camps = new Set([...prev.campaigns, ...cur.campaigns].map(c => c.name));
  const keyG = g => norm(g.pc)+"|"+norm(g.spell);
  const pg = new Map(prev.grimoires.map(g => [keyG(g), g])), cg = new Map(cur.grimoires.map(g => [keyG(g), g]));
  const campOfPc = (d, pc) => (d.pcs.find(p => norm(p.name) === norm(pc)) || {}).campaign || "?";
  for (const camp of camps){
    const items = [];
    const inCamp = (d, pc) => norm(campOfPc(d, pc)) === norm(camp);
    const inP = prev.campaigns.some(c => norm(c.name) === norm(camp)), inC = cur.campaigns.some(c => norm(c.name) === norm(camp));
    if (!inC){ out.push(`<h3>${esc(camp)}</h3><ul><li class="del">Campagne retirée du site</li></ul>`); continue; }
    if (!inP){ out.push(`<h3>${esc(camp)}</h3><ul><li class="add">Nouvelle campagne publiée (${cur.pcs.filter(p => norm(p.campaign)===norm(camp)).length} PJ)</li></ul>`); continue; }
    for (const [k,g] of cg) if (inCamp(cur,g.pc)) {
      const o = pg.get(k);
      if (!o) items.push(`<li class="add">${esc(g.pc)} ${g.learning ? "commence à apprendre" : "apprend"} ${esc(g.spell)}${g.memory ? " (en mémoire)" : ""}</li>`);
      else {
        if (!!o.learning !== !!g.learning) items.push(`<li class="add">${esc(g.pc)} ${g.learning ? "repasse en apprentissage de" : "a fini d'apprendre"} ${esc(g.spell)}</li>`);
        else if (g.learning && (o.progress||"") !== (g.progress||"")) items.push(`<li>${esc(g.pc)} : progression sur ${esc(g.spell)}${g.progress ? " (" + esc(g.progress) + ")" : ""}</li>`);
        if (o.memory !== g.memory) items.push(`<li>${esc(g.pc)} : ${esc(g.spell)} ${g.memory ? "passe en mémoire" : "sort de la mémoire"}</li>`);
        if (ws(o.incantation) !== ws(g.incantation)) items.push(`<li>${esc(g.pc)} : incantation de ${esc(g.spell)} modifiée</li>`);
      }
    }
    for (const [k,g] of pg) if (!cg.has(k) && inCamp(prev,g.pc)) items.push(`<li class="del">${esc(g.pc)} perd ${esc(g.spell)}</li>`);
    const pb = new Map(prev.books.filter(b => norm(b.campaign)===norm(camp)).map(b => [norm(b.name), b]));
    cur.books.filter(b => norm(b.campaign)===norm(camp)).forEach(b => {
      const o = pb.get(norm(b.name));
      if (!o) items.push(`<li class="add">Ouvrage révélé : ${esc(b.name)}</li>`);
      else if (o.lang !== b.lang || o.mod !== b.mod) items.push(`<li>${esc(b.name)} : langue ou modificateur modifié</li>`);
    });
    pb.forEach((b,k) => { if (!cur.books.some(x => norm(x.campaign)===norm(camp) && norm(x.name)===k)) items.push(`<li class="del">Ouvrage caché ou retiré : ${esc(b.name)}</li>`); });
    const pp = new Set(prev.pcs.filter(p=>norm(p.campaign)===norm(camp)).map(p=>norm(p.name)));
    cur.pcs.filter(p=>norm(p.campaign)===norm(camp)).forEach(p => { if (!pp.has(norm(p.name))) items.push(`<li class="add">Nouveau PJ : ${esc(p.name)}</li>`); });
    prev.pcs.filter(p=>norm(p.campaign)===norm(camp)).forEach(p => { if (!cur.pcs.some(x => norm(x.name)===norm(p.name))) items.push(`<li class="del">PJ retiré : ${esc(p.name)}</li>`); });
    const pPc = new Map(prev.pcs.map(p => [norm(p.name), p]));
    cur.pcs.filter(p=>norm(p.campaign)===norm(camp)).forEach(p => { const o = pPc.get(norm(p.name)); if (o && (o.int !== p.int || o.full !== p.full || o.id !== p.id)) items.push(`<li>${esc(p.name)} : fiche modifiée (nom, INT ou lien)</li>`); });
    if (items.length) out.push(`<h3>${esc(camp)}</h3><ul>${items.join("")}</ul>`);
  }
  const ps = new Map(prev.spells.map(s => [norm(s.name), s]));
  const cat = [];
  cur.spells.forEach(s => {
    const o = ps.get(norm(s.name));
    if (!o) { cat.push(`<li class="add">Nouveau sort visible : ${esc(s.name)}</li>`); return; }
    const f = ["cost","type","ref","range","effects","origin"].filter(k => ws(o[k]) !== ws(s[k]));
    const lbl = {cost:"coût",type:"type",ref:"réf.",range:"portée",effects:"effets",origin:"origine"};
    if (f.length) cat.push(`<li>${esc(s.name)} : ${f.map(k=>lbl[k]).join(", ")}</li>`);
  });
  prev.spells.forEach(s => { if (!cur.spells.some(c => norm(c.name)===norm(s.name))) cat.push(`<li class="del">Sort plus visible : ${esc(s.name)}</li>`); });
  if (cat.length) out.push(`<h3>Sorts</h3><ul>${cat.join("")}</ul>`);
  return out.join("") || `<p class="muted">Aucun changement.</p>`;
}
