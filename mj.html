/* ---------- GitHub ---------- */
const GH = {
  cfg(){ return store.get(LS_GH) || { owner:"", repo:"grimoires", token:"" }; },
  ready(){ const c = this.cfg(); return !!(c.owner && c.repo && c.token); },
  siteUrl(){ const c = this.cfg(); return `https://${c.owner.toLowerCase()}.github.io/${c.repo}/`; },
  async api(path, opts = {}){
    const c = this.cfg();
    const res = await fetch(`https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}${path}`, {
      method: opts.method || "GET", cache: "no-store", body: opts.body,
      headers: { "Accept":"application/vnd.github+json", "Authorization":`Bearer ${c.token}`, "X-GitHub-Api-Version":"2022-11-28" } });
    if (res.status === 404 && opts.allow404) return null;
    if (!res.ok){ let m = ""; try { m = (await res.json()).message; } catch {} const e = new Error(`GitHub ${res.status}${m ? " : " + m : ""}`); e.status = res.status; throw e; }
    return res.status === 204 ? null : res.json();
  },
  async get(path){ const j = await this.api(`/contents/${path}`, {allow404:true}); return j && !Array.isArray(j) ? { sha: j.sha, text: b64dec(j.content || "") } : null; },
  async list(dir){ const j = await this.api(`/contents/${dir}`, {allow404:true}); return Array.isArray(j) ? j : []; },
  put(path, text, sha, message){ return this.api(`/contents/${path}`, { method:"PUT", body: JSON.stringify({ message, content: b64enc(text), ...(sha ? {sha} : {}) }) }); },
  del(path, sha, message){ return this.api(`/contents/${path}`, { method:"DELETE", body: JSON.stringify({ message, sha }) }); }
};
let ONLINE = null, DIFF_BASE = null, PUB_MSG = "", PUB_CLS = "", BUSY = false;
const ghError = e => e.status === 401 ? "Clé de publication refusée (expirée ou mal copiée)."
  : e.status === 403 ? "La clé n'a pas les droits nécessaires sur ce dépôt (Contents : Read and write)."
  : e.status === 404 ? "Dépôt introuvable : vérifie le nom d'utilisateur, le nom du dépôt, et que la clé y a accès."
  : /fetch/i.test(e.message) ? "Impossible de joindre GitHub : vérifie la connexion internet." : e.message;
function setMsg(m, cls = ""){ PUB_MSG = m; PUB_CLS = cls; renderPub(); }

async function fetchOnline(){
  const files = (await GH.list("data")).filter(f => f.name.endsWith(".json"));
  const views = [];
  for (const f of files){
    const g = await GH.get(`data/${f.name}`);
    try { views.push({ id: f.name.replace(/\.json$/, ""), sha: g.sha, text: g.text, data: JSON.parse(g.text) }); } catch {}
  }
  return views;
}
async function refreshOnline(){
  if (!GH.ready() || !M) return;
  try {
    ONLINE = await fetchOnline();
    DIFF_BASE = "online";
    DIFF = diff(mergeViews(ONLINE), mergeViews(publishedViews(M)));
    if (PUB_CLS === "err") setMsg("");
  } catch(e){ ONLINE = null; setMsg(ghError(e), "err"); }
  renderMJ();
}
async function publish(){
  const blocking = M.issues.filter(i => typeof i === "string");
  if (blocking.length && !confirm(`${blocking.length} point(s) à vérifier dans les contrôles. Publier quand même ?`)) return;
  BUSY = true; setMsg("Publication en cours…");
  try {
    const cur = publishedViews(M), online = await fetchOnline();
    let n = 0;
    for (const v of cur){
      const text = JSON.stringify(v.data), o = online.find(x => x.id === v.id);
      if (o && o.text === text) continue;
      await GH.put(`data/${v.id}.json`, text, o && o.sha, `Grimoires : ${v.name}`); n++;
    }
    for (const o of online) if (!cur.some(v => v.id === o.id)){ await GH.del(`data/${o.id}.json`, o.sha, `Retrait de la campagne ${o.id}`); n++; }
    BUSY = false;
    setMsg(n ? `Publié à ${new Date().toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})}. Les joueurs verront les changements d'ici une minute environ, en rechargeant la page.` : "Rien à publier : le site est déjà à jour.", "ok");
    await refreshOnline();
  } catch(e){ BUSY = false; setMsg(ghError(e), "err"); }
}
async function installSite(){
  BUSY = true; setMsg("Installation du site…");
  try {
    let n = 0;
    const files = { ...SITE_FILES };
    if (SELF_HTML){
      /* La page MJ se met elle-même en ligne, sauf si celle du site est plus récente. */
      const o = await GH.get("mj.html");
      const ob = o && (o.text.match(/const BUILD = "([^"]*)"/) || [])[1];
      if (ob && /^\d{4}-/.test(ob) && (!/^\d{4}-/.test(BUILD) || ob > BUILD)){
        BUSY = false;
        setMsg(`La page MJ en ligne (version du ${buildLabel(ob)}) est plus récente que celle-ci (${buildLabel(BUILD)}). Rien n'a été modifié. Utilise plutôt la page en ligne : ${GH.siteUrl()}mj.html`, "err");
        return;
      }
      files["mj.html"] = SELF_HTML;
    }
    for (const [path, text] of Object.entries(files)){
      const o = await GH.get(path);
      if (o && o.text === text) continue;
      await GH.put(path, text, o && o.sha, `Site : ${path}`); n++;
    }
    const repo = await GH.api("");
    let pages = await GH.api("/pages", {allow404:true});
    if (!pages){
      try { pages = await GH.api("/pages", { method:"POST", body: JSON.stringify({ source: { branch: repo.default_branch || "main", path: "/" } }) }); }
      catch(e){ BUSY = false; setMsg(`Fichiers du site en place. Il reste à activer la publication : dans GitHub, Settings → Pages → Branch « ${repo.default_branch || "main"} » → Save.`, "err"); return; }
    }
    BUSY = false;
    setMsg(`${n ? "Site installé" : "Site déjà à jour"}, page MJ en ligne comprise (version du ${buildLabel(BUILD)}). Adresse : ${GH.siteUrl()} (les changements peuvent mettre quelques minutes à apparaître).`, "ok");
  } catch(e){ BUSY = false; setMsg(ghError(e), "err"); }
}

  if (!GH.ready() || box.dataset.edit === "1"){

/* ---------- player view ---------- */
function slots(n, int){
  if (!int) return "";
  const total = Math.max(n, int);
  let h = "";
  for (let i = 0; i < total; i++) h += `<span class="slot ${i < n ? (i >= int ? "over" : "on") : ""}"></span>`;
  return `<div class="slots" title="${n} sorts en mémoire sur ${int}">${h}<span class="slots-label ${n>int?"over":""}">${n} / ${int} en mémoire</span></div>`;
}
function spellRow(s, g, extra=""){
  s = campSpell(s, curCampId());
  const al = esc(s.alignment);
  return `<button class="spell al-${al}" data-spell="${esc(s.name)}">
    <span class="bar"></span>
    <span><span class="nm">${g && g.memory ? '<span class="mem-mark" title="En mémoire"></span>' : ""}${esc(s.name)}</span>${extra}
      <span class="meta">${esc([s.type, s.range].filter(Boolean).join(" · "))}</span></span>
    <span class="cost">${esc(s.cost || "—")}<small>${s.cost ? "PM" : ""}</small></span>
  </button>`;
}

  if (inv){

const FILTERS = [
  { key:"Chaos", kind:"al" }, { key:"Balance", kind:"al" }, { key:"Loi", kind:"al" },
  { key:"Sort", kind:"form" }, { key:"Rune", kind:"form" }, { key:"Nécromancie", kind:"form" }
];
function renderGrimoire(mine){
  const blank = { type:"", alignment:"", form:"", cost:"", range:"", effects:"" };
  const entries = mine.map(g => ({ g, s: M.spellBy.get(norm(g.spell)) || { ...blank, name: g.spell } }));
  const learning = entries.filter(e => e.g.learning).sort((a,b) => norm(a.s.name).localeCompare(norm(b.s.name)));
  const known = entries.filter(e => !e.g.learning);
  const memN = known.filter(e => e.g.memory).length;
  const q = norm(ui.q);
  const alF = [...ui.al].map(norm), formF = [...ui.form].map(norm);
  const match = ({g,s}) =>
    (!alF.length || alF.includes(norm(s.alignment))) &&
    (!formF.length || formF.includes(norm(s.form))) &&
    (!q || norm(s.name + " " + s.effects + " " + g.incantation).includes(q));
  const shown = known.filter(e => (!ui.mem || e.g.memory) && match(e))
    .sort((a,b) => norm(a.s.name).localeCompare(norm(b.s.name)));
  const learnShown = ui.mem ? [] : learning.filter(match);
  let rows = "", last = "";
  shown.forEach(({g,s}) => {
    const L = norm(s.name).charAt(0).toUpperCase();
    if (L !== last){ rows += `<div class="letter">${L}</div>`; last = L; }
    rows += spellRow(s, g);
  });
  const learnBlock = learnShown.length ? `<div class="learning"><h3>En cours d'apprentissage</h3>${learnShown.map(({g,s}) =>
      spellRow(s, g, g.progress ? `<span class="prog">${esc(g.progress)}</span>` : "")).join("")}</div>` : "";
  const filtered = ui.q || ui.al.size || ui.form.size;
  return `
    <div class="tools">
      <div class="seg" role="group" aria-label="Sorts affichés">
        <button data-mem="1" aria-pressed="${ui.mem}">En mémoire<span class="n">${memN}</span></button>
        <button data-mem="0" aria-pressed="${!ui.mem}">Tous<span class="n">${known.length}</span></button>
      </div>
      <input class="search" id="q" type="search" placeholder="Chercher un sort, un effet…" value="${esc(ui.q)}" autocomplete="off">
      <div class="chips">
        ${FILTERS.map((f,i) => `${i === 3 ? '<span class="sep"></span>' : ""}<button class="chip al-${esc(f.key)}" data-${f.kind}="${esc(f.key)}" aria-pressed="${(f.kind==="al"?ui.al:ui.form).has(f.key)}">${esc(f.key)}</button>`).join("")}
      </div>
    </div>
    <div class="list">${learnBlock}${rows || (learnBlock ? "" : `<div class="empty">${ui.mem && !memN ? "Aucun sort en mémoire." : "Aucun sort ne correspond."}${filtered ? ' <button class="btn" id="reset">Effacer les filtres</button>' : ""}</div>`)}</div>`;
}
function campPcs(camp){ return M.pcs.filter(p => norm(p.campaign) === norm(camp.name)); }
function knownBy(camp, spellName){
  return campPcs(camp).map(p => ({ p, g: M.grimoires.find(g => norm(g.pc) === norm(p.name) && norm(g.spell) === norm(spellName)) })).filter(x => x.g);
}
function renderMjGrimoire(camp){
  const pcs = campPcs(camp);
  const sel = pcs.find(p => p.id === ui.mjPc) || null;
  const LEARN = "__apprentissage", learnMode = ui.mjPc === LEARN;
  const learning = M.grimoires.filter(g => g.learning && pcs.some(p => norm(p.name) === norm(g.pc)));
  const learnSet = new Set(learning.map(g => norm(g.spell)));
  const q = norm(ui.q), alF = [...ui.al].map(norm), formF = [...ui.form].map(norm);
  let list = M.spells.slice();
  if (learnMode) list = list.filter(s => learnSet.has(norm(s.name)));
  if (sel){ const own = new Set(M.grimoires.filter(g => norm(g.pc) === norm(sel.name)).map(g => norm(g.spell))); list = list.filter(s => own.has(norm(s.name))); }
  list = list.filter(s => (!alF.length || alF.includes(norm(s.alignment))) && (!formF.length || formF.includes(norm(s.form))) && (!q || norm(s.name + " " + s.effects).includes(q)))
    .sort((a,b) => norm(a.name).localeCompare(norm(b.name)));
  let rows = "", last = "";
  list.forEach(s => {
    const L = norm(s.name).charAt(0).toUpperCase();
    if (L !== last){ rows += `<div class="letter">${L}</div>`; last = L; }
    let extra = "";
    if (learnMode){
      extra = `<span class="prog">${learning.filter(g => norm(g.spell) === norm(s.name)).map(g => esc(g.pc) + (g.progress ? " : " + esc(g.progress) : "")).join("<br>")}</span>`;
    } else if (sel){
      const g = M.grimoires.find(g => norm(g.pc) === norm(sel.name) && norm(g.spell) === norm(s.name));
      extra = g.learning ? ' <span class="tag learning-tag">en apprentissage</span>' : g.memory ? ' <span class="tag">en mémoire</span>' : "";
    } else {
      const kb = knownBy(camp, s.name);
      extra = `<span class="prog mj-who">${kb.length ? kb.map(({p,g}) => esc(p.name) + (g.learning ? " (appr.)" : g.memory ? " ◆" : "")).join(", ") : "Aucun PJ"}</span>`;
    }
    rows += spellRow(s, null, extra);
  });
  const filtered = ui.q || ui.al.size || ui.form.size;
  return `
    <div class="tools">
      <div class="chips mj-pcs">
        <button class="chip" data-mjpc="" aria-pressed="${!sel && !learnMode}">Tous les sorts</button>
        <button class="chip learn-chip" data-mjpc="${LEARN}" aria-pressed="${learnMode}">En apprentissage <span class="n">${learnSet.size}</span></button>
        <span class="sep"></span>
        ${pcs.map(p => `<button class="chip" data-mjpc="${esc(p.id)}" aria-pressed="${sel && sel.id === p.id}">${esc(p.name)}</button>`).join("")}
      </div>
      <input class="search" id="q" type="search" placeholder="Chercher un sort, un effet…" value="${esc(ui.q)}" autocomplete="off">
      <div class="chips">
        ${FILTERS.map((f,i) => `${i === 3 ? '<span class="sep"></span>' : ""}<button class="chip al-${esc(f.key)}" data-${f.kind}="${esc(f.key)}" aria-pressed="${(f.kind==="al"?ui.al:ui.form).has(f.key)}">${esc(f.key)}</button>`).join("")}
      </div>
      ${sel || learnMode ? "" : '<p class="muted mj-legend">◆ en mémoire · (appr.) en cours d\'apprentissage</p>'}
    </div>
    <div class="list">${rows || `<div class="empty">${learnMode && !learnSet.size ? "Aucun sort en cours d'apprentissage." : "Aucun sort ne correspond."}${filtered ? ' <button class="btn" id="reset">Effacer les filtres</button>' : ""}</div>`}</div>`;
}
function renderMjLibrary(books){
  if (!books.length) return `<div class="list"><div class="empty">Aucun ouvrage dans cette campagne.</div></div>`;
  return `<div class="list">${books.map(b => {
    const sp = M.contents.filter(c => norm(c.book) === norm(b.name)).map(c => M.spellBy.get(norm(c.spell))).filter(Boolean)
      .sort((a,b2) => norm(a.name).localeCompare(norm(b2.name)));
    const mod = b.mod == null ? "" : (b.mod > 0 ? "+" + b.mod : b.mod === 0 ? "±0" : String(b.mod));
    return `<details class="book">
      <summary><span class="bt">${esc(b.name)}${b.revealed ? "" : ' <span class="tag hidden-tag">non révélé</span>'}</span>
        <span class="bm">${esc([b.lang, mod && "mod. " + mod].filter(Boolean).join(", "))}<br>${sp.length} sorts</span></summary>
      ${sp.map(s => spellRow(s, null)).join("")}
    </details>`;
  }).join("")}</div>`;
}
function renderLibrary(view, mine){
  const known = new Set(mine.filter(g => !g.learning).map(g => norm(g.spell)));
  const learning = new Set(mine.filter(g => g.learning).map(g => norm(g.spell)));
  if (!view.books.length) return `<div class="list"><div class="empty">Le groupe n'a encore trouvé aucun ouvrage.</div></div>`;
  return `<div class="list">${view.books.map(b => {
    const sp = M.contents.filter(c => norm(c.book) === norm(b.name)).map(c => M.spellBy.get(norm(c.spell))).filter(Boolean)
      .sort((a,b2) => norm(a.name).localeCompare(norm(b2.name)));
    const toLearn = sp.filter(s => !known.has(norm(s.name)) && !learning.has(norm(s.name))).length;
    const mod = b.mod == null ? "" : (b.mod > 0 ? "+" + b.mod : b.mod === 0 ? "±0" : String(b.mod));
    return `<details class="book">
      <summary><span class="bt">${esc(b.name)}</span>
        <span class="bm">${esc([b.lang, mod && "mod. " + mod].filter(Boolean).join(", "))}<br>${sp.length} sorts, ${toLearn} à apprendre</span></summary>
      ${sp.map(s => spellRow(s, mine.find(g => norm(g.spell)===norm(s.name)), known.has(norm(s.name)) ? ' <span class="tag">connu</span>' : learning.has(norm(s.name)) ? ' <span class="tag learning-tag">en apprentissage</span>' : ' <span class="tag learn">à apprendre</span>')).join("")}
    </details>`;
  }).join("")}</div>`;
}
function openSpell(name){
  const { view, pc, camp, mj } = current();
  const s = campSpell(M.spellBy.get(norm(name)), curCampId()); if (!s) return;
  const g = pc && M.grimoires.find(x => norm(x.pc)===norm(pc.name) && norm(x.spell)===norm(name));
  const books = (mj ? M.books.filter(b => norm(b.campaign) === norm(camp.name)) : view.books).filter(b => M.contents.some(c => norm(c.book)===norm(b.name) && norm(c.spell)===norm(name)));
  const kb = mj ? knownBy(camp, name) : [];
  const mod = m => m == null ? "" : (m > 0 ? "+" + m : m === 0 ? "±0" : String(m));
  const sheet = document.createElement("div");
  sheet.className = "sheet" + (isDesk() ? "" : " fixed");
  sheet.innerHTML = `<div class="card al-${esc(s.alignment)}" role="dialog" aria-modal="true" aria-label="${esc(s.name)}">
    <button class="x" aria-label="Fermer">×</button>
    <h2>${esc(s.name)}</h2>
    <div class="kind">${esc(s.type || "Type non renseigné")}</div>
    ${g ? (g.learning ? `<span class="statusline learn">En cours d'apprentissage${g.progress ? " : " + esc(g.progress) : ""}</span>`
      : `<span class="statusline ${g.memory?"mem":""}">${g.memory ? "En mémoire" : "Connu, à consulter dans le grimoire"}</span>`) : pc ? `<span class="statusline">Pas dans le grimoire de ${esc(pc.name)}</span>` : ""}
    <dl class="facts">
      <div><dt>Coût</dt><dd>${esc(s.cost || "—")}${s.cost ? " PM" : ""}</dd></div>
      <div><dt>Portée</dt><dd>${esc(s.range || "—")}</dd></div>
      <div><dt>Réf.</dt><dd>${esc(s.ref || "—")}</dd></div>
    </dl>
    ${g && g.incantation ? `<p class="incant">${esc(g.incantation)}</p>` : ""}
    <p class="effects">${esc(s.effects || "Pas de description.")}</p>
    ${isElemSpell(s.name) && canInvoke() ? invButton() : ""}
    ${mj ? `<h3>Connu de</h3><p class="small">${kb.length ? kb.map(({p,g}) => esc(p.name) + " : " + (g.learning ? "en apprentissage" + (g.progress ? " (" + esc(g.progress) + ")" : "") : g.memory ? "en mémoire" : "connu")).join("<br>") : "Aucun PJ"}</p>` : ""}
    ${books.length ? `<h3>Se trouve dans</h3><p class="small">${books.map(b => esc(b.name) + (b.lang||b.mod!=null ? ` (${esc([b.lang, b.mod!=null ? "mod. "+mod(b.mod) : ""].filter(Boolean).join(", "))})` : "") + (mj && !b.revealed ? " — non révélé" : "")).join("<br>")}</p>`
      : s.origin ? `<h3>Origine</h3><p class="small">${esc(s.origin)}</p>` : ""}
  </div>`;
  const host = isDesk() ? $("#phone") : document.body;
  host.appendChild(sheet);
  const close = () => { sheet.remove(); document.removeEventListener("keydown", onKey); };
  const onKey = e => { if (e.key === "Escape") close(); };
  document.addEventListener("keydown", onKey);
  sheet.addEventListener("click", e => { if (e.target === sheet || e.target.closest(".x")) close(); });
  sheet.querySelector(".x").focus();
  const ib = sheet.querySelector("[data-invoke]"); if (ib) ib.onclick = () => { close(); goInvoke(); };
}
function bindApp(){
  const app = $("#app");
  app.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { ui.tab = b.dataset.tab; renderApp(); });
  const q = app.querySelector("#q");
  if (q) q.oninput = () => { ui.q = q.value; const pos = q.selectionStart; renderApp(true); const nq = $("#app #q"); nq.focus(); nq.setSelectionRange(pos,pos); };
  app.querySelectorAll("[data-mem]").forEach(b => b.onclick = () => { ui.mem = b.dataset.mem === "1"; renderApp(true); });
  app.querySelectorAll("[data-al]").forEach(b => b.onclick = () => { const v=b.dataset.al; ui.al.has(v)?ui.al.delete(v):ui.al.add(v); renderApp(true); });
  app.querySelectorAll("[data-form]").forEach(b => b.onclick = () => { const v=b.dataset.form; ui.form.has(v)?ui.form.delete(v):ui.form.add(v); renderApp(true); });
  const r = app.querySelector("#reset"); if (r) r.onclick = () => { ui.q=""; ui.al.clear(); ui.form.clear(); renderApp(); };
  app.querySelectorAll("[data-import]").forEach(b => b.onclick = () => $("#file").click());
  app.querySelectorAll("[data-mjpc]").forEach(b => b.onclick = () => { ui.mjPc = b.dataset.mjpc; renderApp(true); });
  app.querySelectorAll("[data-spell]").forEach(b => b.onclick = () => openSpell(b.dataset.spell));
}

/* ---------- invocation des élémentaires ---------- */
const ELEM_SPELL = "Convoquer un Elémentaire";
const ELEM_RULES_PATH = "regles/elementaires.json";
const LS_INV = "grimoires.invocation.";
const isElemSpell = n => norm(n) === norm(ELEM_SPELL);
let ELEM = null, ELEM_ERR = false, INV_FROM_APP = false, VIEW = "list", LIST_SCROLL = null;

async function loadElemRules(){
  if (ELEM) return ELEM;
  try {
    if (SITE_FILES[ELEM_RULES_PATH]) ELEM = JSON.parse(SITE_FILES[ELEM_RULES_PATH]);
    else { const r = await fetch(ELEM_RULES_PATH, { cache: "no-cache" }); if (r.ok) ELEM = await r.json(); }
  } catch {}
  ELEM_ERR = !ELEM;
  return ELEM;
}
/* Accès à l'invocation :
   "full"  : le grimoire du MJ, ou un PJ qui connaît le sort ;
   "essai" : un PJ qui l'a en cours d'apprentissage, ou qui peut le trouver dans un ouvrage révélé à sa campagne
             (simulation pour découvrir le sort, rangée à part) ;

function invAccess(){

/* règles */
/* Conversion des PM dépensés en PM de la table (règle de campagne « pm ») ; null = PM de la table saisis directement. */
function pmConv(){ const r = campRule(); return r && r.pm ? r.pm : null; }
function toTablePM(spent){ const cv = pmConv(); return cv ? cv.base + cv.perPoint * (spent - cv.min) : spent; }
function pmRange(){ const cv = pmConv(); return cv ? { min: cv.min, max: cv.max } : { min: ELEM.pmMin, max: ELEM.pmMax }; }
const shownPM = st => pmConv() ? st.spent : st.pm;
const sheetPM = sh => sh.spent != null ? sh.spent : sh.pm;
const freeWord = () => pmConv() ? "point" : "PM";
const freeWords = () => pmConv() ? "points" : "PM";
function trimUp(st){
  const total = freePM(st.pm);
  while (usedPM(st.up) > total){ const k = Object.keys(st.up).filter(k => st.up[k] > 0).pop(); st.up[k]--; if (!st.up[k]) delete st.up[k]; }
}
/* Règle propre à une campagne (regles/elementaires.json → campaignRules) : chances des compétences et attaques.
   Les dommages se calculent toujours comme si chaque PM ajoutait 10 % (dmgPct). */
function campRule(){ const { camp } = current(); return (ELEM && ELEM.campaignRules && camp && ELEM.campaignRules[camp.id]) || null; }
function skillPct(base, n, rule){
  let v = base;
  for (let k = 0; k < n; k++) v += rule ? (v + rule.step > rule.cap ? rule.stepOver : rule.step) : 10;
  return v;
}
const dmgPct = (base, n) => base + n*10;
const stepLabel = rule => rule ? "+" + rule.step + "%" : "+10%";
const stepSub = rule => rule ? `+${rule.stepOver}% au-delà de ${rule.cap}%` : "";
const pmIdx = pm => pm < 30 ? 0 : pm - 29;
const freePM = pm => pm < 30 ? pm - 21 : 8;
const STATS6 = ["STR","CON","SIZ","INT","POW","DEX"];
const frMov = m => ({Run:"course",Jump:"saut",Fly:"vol",Swim:"nage"}[m] || m);
const frSkill = sk => /^Ways of/.test(sk) ? "Art : " + sk : sk;
const rollD6 = n => { let s = 0; for (let i = 0; i < n; i++) s += 1 + Math.floor(Math.random()*6); return s; };
const usedPM = up => Object.values(up).reduce((a,b) => a + b, 0);
function catalogue(R, rule){
  const l = [
    {key:"STR", label:"STR +1D6", cap:Infinity}, {key:"CON", label:"CON +1D6", cap:Infinity}, {key:"SIZ", label:"SIZ +1D6", cap:Infinity},
    {key:"INT", label:"INT +1D6", sub:"une fois au plus", cap:1}
  ];
  if (R.canDex) l.push({key:"DEX", label:"DEX +1D6", sub:"une fois au plus", cap:1});
  Object.keys(R.mov).forEach(m => l.push({key:"MOV:"+m, label:`MOV (${frMov(m)}) +2`, cap:Infinity}));
  Object.keys(R.rolls).forEach(r => l.push({key:"ROLL:"+r, label:`${r} ${stepLabel(rule)}`, sub:stepSub(rule), cap:Infinity}));
  R.fixedSkills.forEach(([sk]) => l.push({key:"SKILL:"+sk, label:`${frSkill(sk)} ${stepLabel(rule)}`, sub:stepSub(rule), cap:Infinity}));
  l.push({key:"LANG", label:`Langue de l'invocateur ${stepLabel(rule)}`, sub:"base INT×2" + (rule ? ", " + stepSub(rule) : ""), cap:Infinity});
  return l;
}
function projection(R, pm, up, key, rule){
  const i = pmIdx(pm), c = up[key] || 0;
  if (STATS6.includes(key)){ const s = R.stats[key], b = s.bonus ? "+" + s.bonus : ""; return { base:s.min[i]+"D6"+b, now:(s.min[i]+c)+"D6"+b }; }
  if (key.startsWith("MOV:")){ const v = R.mov[key.slice(4)][i]; return { base:""+v, now:""+(v+c*2) }; }
  if (key.startsWith("ROLL:")){ const v = R.rolls[key.slice(5)][i]; return { base:v+"%", now:skillPct(v, c, rule)+"%" }; }
  if (key.startsWith("SKILL:")){ const e = R.fixedSkills.find(s => s[0] === key.slice(6)); const v = e ? e[1] : 0; return { base:v+"%", now:skillPct(v, c, rule)+"%" }; }

}
function impactDB(v){
  const t = [[1,4,"-5"],[5,8,"-4"],[9,12,"-3"],[13,15,"-2"],[16,18,"-1"],[19,23,"0"],[24,26,"+1"],[27,29,"+2"],[30,33,"+3"],[34,37,"+4"],[38,41,"+5"]];
  for (const [a,b,x] of t) if (v >= a && v <= b) return x;

  if (v <= 53) return "2D6";

}
function attackDamage(pct){

  const d10 = Math.floor(pct/50), r = Math.floor((pct % 50)/10)*10;

  if (!imp || imp === "0") return base;

}
function conjure(st){
  const R = ELEM.elementals[st.elem], i = pmIdx(st.pm), vals = {};
  STATS6.forEach(s => { const n = R.stats[s].min[i] + (s === "POW" ? 0 : (st.up[s] || 0)); vals[s] = rollD6(n) + R.stats[s].bonus; });
  st.sheet = { elem: st.elem, pm: st.pm, spent: pmConv() ? st.spent : null, up: { ...st.up }, vals, hpLoss: 0, rule: campRule() };

function randomUp(st){
  const R = ELEM.elementals[st.elem], cat = catalogue(R), total = freePM(st.pm);
  st.up = {};
  for (let k = 0; k < total; k++){
    const av = cat.filter(u => (st.up[u.key] || 0) < u.cap);
    if (!av.length) break;
    const u = av[Math.floor(Math.random()*av.length)];

    <h3>Résistance et particularités</h3>
    <div>${R.resist.map(r => `<div class="line"><div class="nm"><small style="font-size:.92rem;color:var(--ink-2)">${esc(r)}</small></div><div></div></div>`).join("")}</div>
    <p class="effects" style="margin-top:10px;font-size:.95rem;color:var(--ink-2)">${esc(R.note)}</p>
    <details class="el-traits el-${esc(R.color)}"><summary>Nature de l'élémentaire</summary><ul>${R.lore.map(l => `<li>${esc(l)}</li>`).join("")}</ul></details>
    <div class="inv-actions">
      <button class="btn" data-inv-tab="prep">Préparer une autre invocation</button>
      <button class="btn" id="invDismiss">Renvoyer l'élémentaire</button>
    </div>`;
}
function bindInvoke(){
  const app = $("#app");
  const upd = f => { const st = invState(); f(st); invSave(st); renderApp(true); };
  const b = app.querySelector("[data-inv-back]"); if (b) b.onclick = leaveInvoke;
  app.querySelectorAll("[data-inv-tab]").forEach(x => x.onclick = () => upd(st => { if (x.dataset.invTab === "prep" || st.sheet) st.tab = x.dataset.invTab; }));
  app.querySelectorAll("[data-inv-el]").forEach(x => x.onclick = () => upd(st => { if (st.elem !== x.dataset.invEl){ st.elem = x.dataset.invEl; st.up = {}; } }));
  const setPm = (st, v) => {
    const rg = pmRange(); v = Math.min(rg.max, Math.max(rg.min, v));
    if (pmConv()) st.spent = v;
    st.pm = toTablePM(v);
    trimUp(st);
  };
  app.querySelectorAll("[data-inv-pm]").forEach(x => x.onclick = () => upd(st => setPm(st, shownPM(st) + Number(x.dataset.invPm))));
  const r = app.querySelector("#invPm");
  if (r){ r.oninput = () => { $("#invPmVal").textContent = r.value; }; r.onchange = () => upd(st => setPm(st, Number(r.value))); }
  app.querySelectorAll("[data-inv-up]").forEach(x => x.onclick = () => upd(st => {
    const k = x.dataset.invUp, d = Number(x.dataset.d), u = catalogue(ELEM.elementals[st.elem]).find(u => u.key === k), c = st.up[k] || 0;
    if (d > 0 && (usedPM(st.up) >= freePM(st.pm) || c >= u.cap)) return;
    if (d < 0 && c <= 0) return;
    st.up[k] = c + d; if (!st.up[k]) delete st.up[k];
  }));
  app.querySelectorAll("[data-inv-mode]").forEach(x => x.onclick = () => upd(st => { st.mode = x.dataset.invMode; if (st.mode === "libre") st.up = {}; }));
  const go = app.querySelector("#invGo");
  if (go) go.onclick = () => {
    const st = invState();
    if (st.sheet && !confirm(`Remplacer le ${st.sheet.elem.toLowerCase()} déjà invoqué ?`)) return;
    if (st.mode === "alea") randomUp(st);
    conjure(st); invSave(st); renderApp(); window.scrollTo(0, 0);
  };
  const dis = app.querySelector("#invDismiss");
  if (dis) dis.onclick = () => { if (!confirm("Renvoyer l'élémentaire ? Sa fiche sera effacée.")) return; upd(st => { st.sheet = null; st.tab = "prep"; }); };
  const hpIn = app.querySelector("#invHp");
  const showHp = st => { const max = st.sheet.vals.CON + st.sheet.vals.SIZ, cur = max - st.sheet.hpLoss, el = $("#invHpCur"); el.innerHTML = `HP <b>${cur}</b> / ${max}`; el.classList.toggle("down", cur <= 0); };
  if (hpIn) hpIn.oninput = () => { const st = invState(); st.sheet.hpLoss = Math.max(0, parseInt(hpIn.value, 10) || 0); invSave(st); showHp(st); };
  app.querySelectorAll("[data-inv-hp]").forEach(x => x.onclick = () => {
    const st = invState(); st.sheet.hpLoss = Math.max(0, (st.sheet.hpLoss || 0) + Number(x.dataset.invHp)); invSave(st);
    hpIn.value = st.sheet.hpLoss; showHp(st);
  });
}


/* ---------- navigation ---------- */
let LAST_CP = null;
function cpChanged(){ const r = route(), k = (r.c || "") + "/" + (r.p || ""); const ch = LAST_CP !== null && k !== LAST_CP; LAST_CP = k; return ch; }
function resetUi(){ ui.q=""; ui.al.clear(); ui.form.clear(); ui.mem=true; ui.mjPc=""; }
function onRouteChange(){ if (cpChanged()) resetUi(); if (route().v !== "invoquer") INV_FROM_APP = false; }

/* ---------- loading (MJ) ---------- */
function load(data, {fromFile} = {}){
  const prev = store.get(LS_CUR);
  if (fromFile){ if (prev) store.set(LS_PREV, prev); store.set(LS_CUR, data); }
  const p = fromFile ? prev : store.get(LS_PREV);
  M = buildModel(data);
  if (MJ_FULL && route().p !== MJ_ID){ const c = M.campaigns.find(x => x.id === route().c) || M.campaigns.find(x => x.active) || M.campaigns[0]; if (c) history.replaceState(null, "", "#" + encodeURIComponent(c.id) + "/" + MJ_ID); }
  if (GH.ready()){ DIFF = null; DIFF_BASE = "online"; refreshOnline(); }
  else { DIFF_BASE = "import"; DIFF = p ? diff(mergeViews(publishedViews(buildModel(p))), mergeViews(publishedViews(M))) : null; }
  const n = M.issues.filter(i => typeof i === "string").length;
  $("#status").innerHTML = `${fromFile ? "Importé" : "Chargé"} : ${data.spells.length} sorts, ${data.pcs.length} PJ, ${data.campaigns.length} campagne(s), ${data.books.length} ouvrage(s). ` +
    (n ? `<strong style="color:var(--warn)">${n} point(s) à vérifier.</strong>` : "Aucune anomalie.");
  renderMJ(); renderApp();
}
function readFile(file){
  const r = new FileReader();
  r.onload = () => {
    try { load(parseWorkbook(XLSX.read(r.result, {type:"array"})), {fromFile:true}); }
    catch(e){
      $("#status").innerHTML = `<strong style="color:var(--warn)">Import impossible :</strong> ${esc(e.message)}`;
      if (MJ_FULL) $("#app").insertAdjacentHTML("afterbegin", `<div class="nodata" style="color:var(--warn)">Import impossible : ${esc(e.message)}</div>`);
    }
  };
  r.readAsArrayBuffer(file);
}
function initMJ(){
  const vb = $("#mjBuild"); if (vb) vb.textContent = "Version du " + buildLabel(BUILD) + ".";
  if (MJ_FULL){
    $("#desk").classList.add("player-only");
    if (!location.hash.replace(/^#\/?/,"")){ const d = store.get(LS_CUR); const c = d && ((d.campaigns || []).find(x => x.active) || (d.campaigns || [])[0]); if (c) history.replaceState(null, "", "#" + encodeURIComponent(c.id || slug(c.name)) + "/" + MJ_ID); }
  }
  const drop = $("#drop");
  $("#file").onchange = e => e.target.files[0] && readFile(e.target.files[0]);
  ["dragenter","dragover"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add("over"); }));
  ["dragleave","drop"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove("over"); }));
  drop.addEventListener("drop", e => e.dataTransfer.files[0] && readFile(e.dataTransfer.files[0]));
  window.addEventListener("hashchange", () => { onRouteChange(); renderMJ(); renderApp(); });
  cpChanged();

  renderPub();
  if (typeof XLSX === "undefined"){ $("#status").textContent = "Le lecteur de fichiers Excel ne s’est pas chargé."; renderApp(); return; }
  const saved = store.get(LS_CUR);
  if (saved) load(saved);
  else if (EMBEDDED_XLSX.length > 20){
    const bin = Uint8Array.from(atob(EMBEDDED_XLSX), c => c.charCodeAt(0));
    const data = parseWorkbook(XLSX.read(bin, {type:"array"}));
    store.set(LS_CUR, data);
    load(data);
  } else renderApp();
}

/* ---------- loading (site joueurs) ---------- */
let LOADED = null;
async function loadCampaign(id){
  let data = null;
  try {
    const res = await fetch(`data/${encodeURIComponent(id)}.json`, { cache: "no-cache" });
    if (res.ok){ data = await res.json(); store.set("grimoires.data." + id, data); }
  } catch {}
  if (!data) data = store.get("grimoires.data." + id);
  LOADED = id;
  M = data ? buildModel(data) : null;
  if (!M){ $("#app").innerHTML = `<div class="nodata">Ce lien ne correspond à aucune campagne publiée. Vérifie-le auprès de ton MJ.</div>`; return; }
  renderApp();
}
function initSite(){
  $("#desk").classList.add("player-only");
  if (!location.hash.replace(/^#\/?/,"")){ const last = store.get(LS_ROUTE); if (last) history.replaceState(null, "", "#" + last); }
  const go = () => {
    const r = route();
    if (!r.c){ $("#app").innerHTML = `<div class="nodata">Ouvre le lien personnel que ton MJ t'a envoyé.</div>`; return; }
    store.set(LS_ROUTE, location.hash.replace(/^#\/?/,""));
    if (r.c !== LOADED) loadCampaign(r.c); else renderApp();
  };
  window.addEventListener("hashchange", () => { onRouteChange(); go(); });
  cpChanged();
  go();
  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
}
function init(){ MODE === "site" ? initSite() : initMJ(); }
init();
</script></body></html>
